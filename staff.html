<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>在籍作成ルーム管理（内勤用）</title>
<style>
  :root{
    color-scheme: light;
    --bg:#FAF7F5;
    --pink:#F2A6B3;
    --pink-soft:#FDEDF0;
    --lav:#B9A6D9;
    --lav-soft:#F1EAFA;
    --mint:#7FC8AA;
    --mint-soft:#E6F6EE;
    --ink:#5C4B4F;
    --sub:#9C8B8F;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#FAF7F5 !important;
      --pink:#F2A6B3 !important;
      --pink-soft:#FDEDF0 !important;
      --lav:#B9A6D9 !important;
      --lav-soft:#F1EAFA !important;
      --mint:#7FC8AA !important;
      --mint-soft:#E6F6EE !important;
      --ink:#5C4B4F !important;
      --sub:#9C8B8F !important;
    }
    html, body{
      background:#FAF7F5 !important;
      color:#5C4B4F !important;
    }
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", Roboto, sans-serif;
    background:#FAF7F5 !important;
    color:#5C4B4F !important;
    line-height:1.7;
  }
  body{
    padding:24px 18px 60px;
    max-width:640px;
    margin:0 auto;
  }
  .header{ text-align:center; margin-bottom:22px; }
  .kicker{
    display:inline-block;
    font-size:12.5px;
    color:#fff;
    background:var(--pink);
    font-weight:800;
    padding:4px 16px;
    border-radius:99px;
  }
  h1{ font-size:21px; margin:10px 0 6px; font-weight:800; color:#5C4B4F; }
  .lead{ font-size:12.5px; color:var(--sub); }

  .card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(217,160,180,.14);
  }
  .card-title{ font-size:15px; font-weight:800; margin-bottom:14px; color:#5C4B4F; }
  .card-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .card-title-row .card-title{ margin-bottom:0; }
  .btn-refresh{
    border:none;
    background:var(--mint-soft);
    color:#2c5b45;
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:7px 14px;
    border-radius:99px;
    cursor:pointer;
  }

  label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    margin:12px 0 5px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=number], input[type=password]{
    width:100%;
    padding:10px 13px;
    border:1.5px solid #eee;
    border-radius:11px;
    font-size:14px;
    font-family:inherit;
    background:#FAF8F6;
    color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--pink); background:#fff; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .store-checkbox-group{
    background:#FAF8F6;
    border-radius:11px;
    padding:10px 13px;
    margin-bottom:6px;
  }
  .store-group-label{
    font-size:10.5px;
    font-weight:800;
    color:var(--sub);
    margin:8px 0 4px;
  }
  .store-group-label:first-child{ margin-top:0; }
  .store-checkbox-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--ink);
    padding:4px 0;
    cursor:pointer;
  }
  .store-checkbox-item input[type=checkbox]{
    width:16px; height:16px;
    accent-color:var(--pink);
  }
  .store-back-fields{
    background:var(--pink-soft);
    border-radius:11px;
    padding:12px 13px 4px;
    margin-bottom:6px;
  }

  .btn{
    width:100%;
    border:none;
    background:var(--pink);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:14.5px;
    padding:13px;
    border-radius:99px;
    cursor:pointer;
    margin-top:16px;
  }
  .btn:hover{ background:#e8909f; }
  .btn:disabled{ background:#ddd; cursor:not-allowed; }
  .btn.secondary{ background:var(--mint); }
  .btn.secondary:hover{ background:#5aa886; }
  .btn.danger{ background:#e8899b; }

  .result{
    display:none;
    margin-top:14px;
    background:var(--mint-soft);
    border-radius:14px;
    padding:14px 16px;
  }
  .result.show{ display:block; }
  .result-url{
    word-break:break-all;
    font-size:12.5px;
    color:#2c5b45;
    margin-bottom:10px;
  }

  .room-item{
    background:#fff;
    border-radius:14px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(217,160,180,.1);
    overflow:hidden;
  }
  .room-item.closed{ opacity:0.55; }
  .room-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    cursor:pointer;
  }
  .room-header-main{ flex:1; min-width:0; }
  .room-caret{ font-size:13px; color:var(--sub); flex-shrink:0; }
  .room-body{
    display:none;
    padding:0 16px 16px;
  }
  .room-body.show{ display:block; }
  .room-name{ font-size:14.5px; font-weight:800; margin-bottom:4px; color:var(--ink); }
  .room-meta{ font-size:11.5px; color:var(--sub); margin-bottom:8px; }
  .room-actions{ display:flex; gap:8px; }
  .room-actions button{
    flex:1;
    border:none;
    padding:8px;
    border-radius:99px;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-copy{ background:var(--lav-soft); color:#6c5896; }
  .btn-close{ background:#FDEDF0; color:#c9556a; }
  .btn-delete{ background:#e8899b; color:#fff; }
  .btn-toggle-checklist{ background:var(--mint-soft); color:#2c5b45; }

  .room-progress-track{
    height:7px;
    background:#F0E8E6;
    border-radius:99px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .room-progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--pink), #F0AA6E);
    border-radius:99px;
  }
  .room-checklist{
    display:none;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #F0E8E6;
  }
  .room-checklist.show{ display:block; }
  .room-check-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 0;
  }
  .room-check-icon{
    width:18px; height:18px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px;
  }
  .room-check-icon.done{ background:var(--mint); color:#fff; }
  .room-check-icon.pending{ background:#eee; color:#bbb; }
  .room-check-icon.clickable{ cursor:pointer; transition:transform .1s ease; }
  .room-check-icon.clickable:active{ transform:scale(0.85); }
  .room-check-label{ font-size:12.5px; flex:1; color:var(--ink); }
  .room-check-label.done{ color:var(--sub); text-decoration:line-through; text-decoration-color:#ddd; }
  .room-check-ownerbadge{
    font-size:9.5px;
    padding:1px 7px;
    border-radius:99px;
    flex-shrink:0;
  }
  .room-check-ownerbadge.cast{ background:var(--lav-soft); color:#6c5896; }
  .room-check-ownerbadge.staff{ background:var(--pink-soft); color:#c9556a; }
  .room-check-ownerbadge.staffOnly{ background:#eee; color:#888; }
  .room-check-ownerbadge.staffCheck{ background:var(--mint-soft); color:#2c5b45; }

  .room-checklist-group-title{
    font-size:11px;
    font-weight:800;
    color:var(--sub);
    margin:14px 0 6px;
    padding-top:8px;
    border-top:1px solid #F0E8E6;
  }
  .room-checklist-group-title:first-child{ margin-top:0; border-top:none; padding-top:0; }

  .accordion{
    margin-top:12px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #F0E8E6;
  }
  .accordion-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 13px;
    background:#FAF8F6;
    cursor:pointer;
  }
  .accordion-title{
    flex:1;
    font-size:12.5px;
    font-weight:800;
    color:var(--ink);
  }
  .accordion-progress{
    font-size:11px;
    font-weight:800;
    color:#c9556a;
    background:var(--pink-soft);
    padding:2px 9px;
    border-radius:99px;
  }
  .accordion-caret{ font-size:11px; color:var(--sub); }
  .accordion-body{
    display:none;
    padding:6px 13px 12px;
  }
  .accordion-body.show{ display:block; }

  .talk-card{
    border-radius:14px;
    padding:13px 14px;
    margin-top:10px;
    border:1.5px solid transparent;
  }
  .talk-card:first-child{ margin-top:0; }
  .talk-card-pink{ background:var(--pink-soft); border-color:#F5CBD3; }
  .talk-card-lav{ background:var(--lav-soft); border-color:#DCCBEE; }
  .talk-card-mint{ background:var(--mint-soft); border-color:#C7E9D8; }
  .talk-card-peach{ background:#FDF0E4; border-color:#F0D6B8; }
  .talk-card-done{ opacity:0.6; }

  .talk-card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .talk-card-badge{
    width:24px; height:24px;
    border-radius:50%;
    background:var(--pink);
    color:#fff;
    font-weight:800;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .talk-card-title{ font-size:13.5px; font-weight:800; color:var(--ink); flex:1; }
  .talk-card-done-mark{
    font-size:10.5px;
    font-weight:800;
    color:#2c5b45;
    background:var(--mint-soft);
    padding:2px 9px;
    border-radius:99px;
  }

  .talk-card-points{
    margin:0 0 8px;
    padding-left:19px;
  }
  .talk-card-points li{
    font-size:12.5px;
    color:var(--ink);
    margin-bottom:4px;
    line-height:1.6;
  }

  .talk-card-detail{
    font-size:11.5px;
    color:#6B655D;
    line-height:1.7;
    margin-bottom:8px;
  }

  .talk-card-say{
    background:#fff;
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:8px;
  }
  .talk-card-say-label{
    font-size:10px;
    font-weight:800;
    color:#c9556a;
    margin-bottom:3px;
  }
  .talk-card-say-text{
    font-size:12px;
    color:#5c2732;
    line-height:1.6;
  }

  .talk-card-btn{
    display:block;
    width:100%;
    border:none;
    font-family:inherit;
    font-weight:800;
    font-size:12.5px;
    padding:10px;
    border-radius:99px;
    cursor:pointer;
  }
  .talk-card-btn-done{ background:var(--pink); color:#fff; }
  .talk-card-btn-undo{ background:#eee; color:#888; }
  .talk-card-closed-note{
    text-align:center;
    font-size:11.5px;
    color:var(--sub);
  }

  .room-choices{
    background:var(--lav-soft);
    border-radius:12px;
    padding:10px 12px;
    margin-top:8px;
  }
  .room-choice-title{ font-size:11px; font-weight:800; color:#6c5896; margin-bottom:6px; }
  .room-choice-row{
    display:flex; justify-content:space-between;
    font-size:12px; color:var(--ink);
    padding:3px 0;
  }
  .room-choice-val{ color:#6c5896; font-weight:700; }
  .room-costume-label{ font-size:11px; font-weight:800; color:#6c5896; margin:10px 0 6px; }
  .room-costume-grid{ display:flex; gap:8px; }
  .room-costume-thumb{
    width:64px; height:80px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #ddd;
  }
  .room-costume-thumb.thumb-error{
    background:#f5f5f5;
  }

  .room-comments{ margin-top:6px; max-height:200px; overflow-y:auto; }
  .room-comment{
    background:#FAF8F6;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .room-comment-meta{ font-size:10px; color:var(--sub); margin-bottom:2px; }
  .room-comment-text{ font-size:12.5px; color:var(--ink); white-space:pre-wrap; }
  .room-comment-empty{ font-size:11.5px; color:var(--sub); padding:6px 0; }
  .room-comment-input-row{ display:flex; gap:6px; margin-top:8px; }
  .room-comment-input{
    flex:1;
    padding:8px 11px;
    border:1.5px solid #eee;
    border-radius:99px;
    font-size:12.5px;
    font-family:inherit;
    background:#FAF8F6;
  }
  .room-comment-input:focus{ outline:none; border-color:var(--pink); background:#fff; }
  .room-comment-send{
    border:none;
    background:var(--pink);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:8px 16px;
    border-radius:99px;
    cursor:pointer;
    flex-shrink:0;
  }

  .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 9px;
    border-radius:99px;
    margin-left:6px;
  }
  .badge.active{ background:var(--mint-soft); color:#2c5b45; }
  .badge.closed{ background:#eee; color:#888; }

  .empty{ text-align:center; color:var(--sub); font-size:13px; padding:30px 0; }

  .token-gate{
    text-align:center;
    padding:60px 20px;
  }
</style>
</head>
<body>

<div id="tokenGate" class="token-gate">
  <span class="kicker">サクラムーングループ・内勤用</span>
  <h1>在籍作成ルーム管理</h1>
  <p class="lead">合言葉を入力してください</p>
  <input type="password" id="tokenInput" placeholder="合言葉" style="max-width:260px;margin:16px auto 0;">
  <button class="btn" id="loginBtn" style="max-width:260px;margin:12px auto 0;" onclick="checkToken()">開く</button>
</div>

<div id="mainApp" style="display:none;">
  <div class="header">
    <span class="kicker">サクラムーングループ・内勤用</span>
    <h1>在籍作成ルーム管理</h1>
    <p class="lead">新人が来たらここでルームを作成し、URLをLINEで送ってください。</p>
  </div>

  <div class="card">
    <div class="card-title">新しいルームを作成</div>

    <label>キャスト名</label>
    <input type="text" id="newName" placeholder="例：ひまり">

    <label>バック金額（円）</label>
    <div class="row3">
      <div><label style="margin:0 0 4px;">60分</label><input type="number" id="newB60" placeholder="9000"></div>
      <div><label style="margin:0 0 4px;">90分</label><input type="number" id="newB90" placeholder="12000"></div>
      <div><label style="margin:0 0 4px;">120分</label><input type="number" id="newB120" placeholder="16000"></div>
    </div>

    <label>本指名バック（円）</label>
    <div class="row2">
      <div><label style="margin:0 0 4px;">60分</label><input type="number" id="newBh60" placeholder="500"></div>
      <div><label style="margin:0 0 4px;">90分</label><input type="number" id="newBh90" placeholder="1000"></div>
    </div>

    <label>在籍店舗</label>
    <div id="storeCheckboxes" class="store-checkbox-group"></div>

    <div id="cutieBackFields" class="store-back-fields" style="display:none;">
      <label>キューティキューティ バック金額（円）</label>
      <div class="row3">
        <div><label style="margin:0 0 4px;">60分</label><input type="number" id="newCutie60" placeholder="9000"></div>
        <div><label style="margin:0 0 4px;">90分</label><input type="number" id="newCutie90" placeholder="12000"></div>
        <div><label style="margin:0 0 4px;">120分</label><input type="number" id="newCutie120" placeholder="16000"></div>
      </div>
      <label>キューティキューティ 本指名バック（円）</label>
      <div class="row2">
        <div><label style="margin:0 0 4px;">60分</label><input type="number" id="newCutieHonshimei60" placeholder="500"></div>
        <div><label style="margin:0 0 4px;">90分</label><input type="number" id="newCutieHonshimei90" placeholder="1000"></div>
      </div>
    </div>

    <div id="gokumonBackFields" class="store-back-fields" style="display:none;">
      <label>極門 バック金額（円）</label>
      <div class="row3">
        <div><label style="margin:0 0 4px;">60分</label><input type="number" id="newGokumon60" placeholder="9000"></div>
        <div><label style="margin:0 0 4px;">90分</label><input type="number" id="newGokumon90" placeholder="12000"></div>
        <div><label style="margin:0 0 4px;">120分</label><input type="number" id="newGokumon120" placeholder="16000"></div>
      </div>
      <label>極門 本指名バック（円）</label>
      <div class="row2">
        <div><label style="margin:0 0 4px;">60分</label><input type="number" id="newGokumonHonshimei60" placeholder="500"></div>
        <div><label style="margin:0 0 4px;">90分</label><input type="number" id="newGokumonHonshimei90" placeholder="1000"></div>
      </div>
    </div>

    <button class="btn" id="createBtn" onclick="createRoom()">ルームを作成</button>

    <div class="result" id="createResult">
      <div class="result-url" id="createUrl"></div>
      <button class="btn secondary" style="margin-top:0;" onclick="copyCreatedUrl()" id="copyBtn">URLをコピー</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <div class="card-title">ルーム一覧</div>
      <button class="btn-refresh" onclick="loadRooms()">🔄 更新</button>
    </div>
    <div id="roomList"><div class="empty">読み込んでいます...</div></div>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxKWQsxsX2SJ0cZ7YfxZJgW1ujmM8xRvrNcjcDYpohI6Gqkem1BhiqVO0PcU8KjjMnf/exec';
  var STAFF_TOKEN_STORAGE_KEY = 'onboarding_room_token';
  var savedToken = null;
  var lastCreatedUrl = '';

  var STORE_LIST_LOCAL = [
    { key: 'sakuramoon',  label: 'サクラムーン',         group: 'basic', defaultChecked: true },
    { key: 'lanauguisu',  label: 'ラナ鶯谷',             group: 'basic', defaultChecked: true },
    { key: 'lanakinshi',  label: 'ラナ錦糸町',           group: 'basic', defaultChecked: true },
    { key: 'peachmoon',   label: 'ピーチムーン五反田',   group: 'basic', defaultChecked: true },
    { key: 'dressgarden', label: 'ドレスガーデン渋谷',   group: 'basic', defaultChecked: true },
    { key: 'cutie',       label: 'キューティキューティ', group: 'other', defaultChecked: false },
    { key: 'gyakuanal',   label: '逆アナル倶楽部',       group: 'other', defaultChecked: false },
    { key: 'gokumon',     label: '極門',                 group: 'other', defaultChecked: false }
  ];

  function renderStoreCheckboxes(){
    var html = '';
    var basicStores = STORE_LIST_LOCAL.filter(function(s){ return s.group === 'basic'; });
    var otherStores = STORE_LIST_LOCAL.filter(function(s){ return s.group === 'other'; });

    html += '<div class="store-group-label">基本店舗</div>';
    basicStores.forEach(function(s){
      html += '<label class="store-checkbox-item">';
      html += '<input type="checkbox" id="store_' + s.key + '" ' + (s.defaultChecked ? 'checked' : '') + ' onchange="onStoreCheckChange()">';
      html += '<span>' + s.label + '</span>';
      html += '</label>';
    });
    html += '<div class="store-group-label">その他店舗</div>';
    otherStores.forEach(function(s){
      html += '<label class="store-checkbox-item">';
      html += '<input type="checkbox" id="store_' + s.key + '" ' + (s.defaultChecked ? 'checked' : '') + ' onchange="onStoreCheckChange()">';
      html += '<span>' + s.label + '</span>';
      html += '</label>';
    });

    document.getElementById('storeCheckboxes').innerHTML = html;
  }

  function onStoreCheckChange(){
    var cutieChecked = document.getElementById('store_cutie').checked;
    var gokumonChecked = document.getElementById('store_gokumon').checked;
    document.getElementById('cutieBackFields').style.display = cutieChecked ? 'block' : 'none';
    document.getElementById('gokumonBackFields').style.display = gokumonChecked ? 'block' : 'none';
  }

  function getSelectedStores(){
    var result = {};
    STORE_LIST_LOCAL.forEach(function(s){
      var el = document.getElementById('store_' + s.key);
      result[s.key] = el ? el.checked : false;
    });
    return result;
  }

  function checkToken(){
    var token = document.getElementById('tokenInput').value.trim();
    if(!token){
      alert('合言葉を入力してください');
      return;
    }

    var loginBtn = document.getElementById('loginBtn');
    if(loginBtn){
      loginBtn.disabled = true;
      loginBtn.textContent = '確認中...';
    }

    fetch(GAS_URL + '?action=checkToken&token=' + encodeURIComponent(token))
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(loginBtn){
          loginBtn.disabled = false;
          loginBtn.textContent = '開く';
        }
        if(!result.valid){
          alert('合言葉が違います');
          return;
        }
        savedToken = token;
        sessionStorage.setItem(STAFF_TOKEN_STORAGE_KEY, token);
        document.getElementById('tokenGate').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        renderStoreCheckboxes();
        loadRooms();
      })
      .catch(function(){
        if(loginBtn){
          loginBtn.disabled = false;
          loginBtn.textContent = '開く';
        }
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
      });
  }

  function createRoom(){

      back120: document.getElementById('newB120').value.trim(),

  function copyCreatedUrl(){
    copyText(lastCreatedUrl, document.getElementById('copyBtn'));
  }

  function copyText(text, btn){
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        btn.textContent = 'コピーしました';
      }).catch(function(){ fallbackCopy(text, btn); });
    } else {
      fallbackCopy(text, btn);
    }
  }

  function fallbackCopy(text, btn){
    var temp = document.createElement('textarea');
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    try{
      document.execCommand('copy');
      btn.textContent = 'コピーしました';
    }catch(e){
      alert('コピーに失敗しました');
    }
    document.body.removeChild(temp);
  }

  var globalChecklistMeta = {};
  var globalTalkChecklistMeta = {};
  var globalStoreList = [];
  var lastRoomsData = [];

  function loadRooms(){
    fetch(GAS_URL + '?action=listRooms&token=' + encodeURIComponent(savedToken))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error){
          document.getElementById('roomList').innerHTML = '<div class="empty">読み込みに失敗しました：' + data.error + '</div>';
          return;
        }
        globalChecklistMeta = data.checklistMeta || {};
        globalTalkChecklistMeta = data.talkChecklistMeta || {};
        globalStoreList = data.storeList || [];
        lastRoomsData = data.rooms || [];
        renderRoomList(data.rooms);
      })
      .catch(function(){
        document.getElementById('roomList').innerHTML = '<div class="empty">通信エラーが発生しました</div>';
      });
  }

  function renderRoomList(rooms){
    if(!rooms || rooms.length === 0){
      document.getElementById('roomList').innerHTML = '<div class="empty">まだルームがありません</div>';
      return;
    }

    var baseUrl = window.location.href.replace('staff.html', 'index.html').split('?')[0];
    var metaKeys = Object.keys(globalChecklistMeta);
    var talkKeys = Object.keys(globalTalkChecklistMeta);

    var html = '';
    rooms.forEach(function(room, idx){
      var isClosed = room.status !== 'active';
      var url = baseUrl + '?id=' + room.roomId;
      var checklist = room.checklist || {};
      var talkChecklist = room.talkChecklist || {};

      var doneCount = metaKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;
      var pct = metaKeys.length ? Math.round(doneCount / metaKeys.length * 100) : 0;

      var talkDoneCount = talkKeys.filter(function(k){ return talkChecklist[k] && talkChecklist[k].done; }).length;

      var castKeys = metaKeys.filter(function(k){ return globalChecklistMeta[k].owner !== 'staffOnly'; });
      var staffOnlyKeys = metaKeys.filter(function(k){ return globalChecklistMeta[k].owner === 'staffOnly'; });
      var castDoneCount = castKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;
      var staffOnlyDoneCount = staffOnlyKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;

      html += '<div class="room-item' + (isClosed ? ' closed' : '') + '" id="roomItem' + idx + '">';
      html += '<div class="room-header" onclick="toggleRoomAccordion(' + idx + ')">';
      html += '<div class="room-header-main">';
      html += '<div class="room-name">' + escapeHtml(room.castName || '（名称未設定）') +
        '<span class="badge ' + (isClosed ? 'closed' : 'active') + '">' + (isClosed ? '終了済み' : '稼働中') + '</span></div>';
      html += '<div class="room-meta">作成：' + formatDate(room.createdAt) + (isClosed ? ' ／ 終了：' + formatDate(room.closedAt) : '') + '　／　全体進捗 ' + doneCount + '/' + metaKeys.length + '</div>';
      html += '<div class="room-progress-track"><div class="room-progress-fill" style="width:' + pct + '%;"></div></div>';
      html += '</div>';
      html += '<span class="room-caret" id="roomCaret' + idx + '">▾</span>';
      html += '</div>';

      html += '<div class="room-body" id="roomBody' + idx + '">';

      html += '<div class="room-actions">';
      html += '<button class="btn-copy" onclick="copyRoomUrl(\'' + url + '\', this)">URLをコピー</button>';
      if(!isClosed){
        html += '<button class="btn-close" onclick="closeRoom(\'' + room.roomId + '\')">終了する</button>';
      } else {
        html += '<button class="btn-delete" onclick="deleteRoom(\'' + room.roomId + '\')">削除する</button>';
      }
      html += '</div>';

      html += '<div id="roomCaptureArea' + idx + '">';

      // キャストの選択内容
      var kit = room.kitChoice || {};
      var wig = room.wigChoice || {};
      var costumeUrls = room.costumeUrls || [];
      var stores = room.stores || {};
      html += '<div class="room-choices">';
      html += '<div class="room-choice-title">キャストの選択内容</div>';
      html += '<div class="room-choice-row"><span>お仕事セット</span><span class="room-choice-val">' + (kit.type === 'shop' ? '事務所で購入' : (kit.type === 'own' ? '自分で用意' : '未回答')) + '</span></div>';
      var wigText = '未回答';
      if(wig.type === 'wig') wigText = 'ウィッグを使う';
      else if(wig.type === 'jimoto') wigText = '地毛（ヘアメイク：' + (wig.hairMake === true ? '行く' : (wig.hairMake === false ? '行かない' : '未回答')) + '）';
      html += '<div class="room-choice-row"><span>ウィッグ/地毛</span><span class="room-choice-val">' + wigText + '</span></div>';

      var storeNames = (globalStoreList || []).filter(function(s){ return stores[s.key]; }).map(function(s){ return s.label; });
      html += '<div class="room-choice-row"><span>在籍店舗</span><span class="room-choice-val">' + (storeNames.length ? escapeHtml(storeNames.join('、')) : '未設定') + '</span></div>';
      html += '<div class="room-choice-row"><span>メールアドレス</span><span class="room-choice-val">' + (room.email ? escapeHtml(room.email) : '未入力') + '</span></div>';

      var hasCostume = costumeUrls.some(function(u){ return !!u; });
      if(hasCostume){
        html += '<div class="room-costume-label">衣装の写真</div>';
        html += '<div class="room-costume-grid">';
        for(var ci=0; ci<3; ci++){
          if(costumeUrls[ci]){
            html += '<a href="' + costumeUrls[ci] + '" target="_blank"><img src="' + costumeUrls[ci] + '" class="room-costume-thumb" alt="衣装' + (ci+1) + '" onerror="this.src=\'\'; this.alt=\'表示不可\'; this.classList.add(\'thumb-error\');"></a>';
          }
        }
        html += '</div>';
      }
      html += '</div>';

      // アコーディオン1：口頭説明チェックリスト
      html += renderAccordion('talk' + idx, '📋 口頭説明チェックリスト', talkDoneCount, talkKeys.length, (function(){
        var inner = '';
        talkKeys.forEach(function(key, tIdx){
          var meta = globalTalkChecklistMeta[key];
          var state = talkChecklist[key] || { done: false };
          inner += renderTalkCheckItem(room.roomId, key, meta, state, isClosed, tIdx + 1);
        });
        return inner;
      })());

      // アコーディオン2：やることリスト（キャストにも表示）
      html += renderAccordion('cast' + idx, '✅ やることリスト（キャストにも表示）', castDoneCount, castKeys.length, (function(){
        var inner = '';
        castKeys.forEach(function(key){
          var meta = globalChecklistMeta[key];
          var state = checklist[key] || { done: false };
          inner += renderRoomCheckItem(room.roomId, key, meta, state, isClosed);
        });
        return inner;
      })());

      // アコーディオン3：内勤チェック（キャストには見えません）
      html += renderAccordion('staffonly' + idx, '🔒 内勤チェック（キャストには見えません）', staffOnlyDoneCount, staffOnlyKeys.length, (function(){
        var inner = '';
        staffOnlyKeys.forEach(function(key){
          var meta = globalChecklistMeta[key];
          var state = checklist[key] || { done: false };
          inner += renderRoomCheckItem(room.roomId, key, meta, state, isClosed);
        });
        return inner;
      })());

      // コメント
      var comments = room.comments || [];
      html += '<div class="room-checklist-group-title">コメント</div>';
      html += '<div class="room-comments" id="roomComments' + idx + '">';
      if(comments.length === 0){
        html += '<div class="room-comment-empty">まだコメントはありません</div>';
      } else {
        comments.slice().reverse().forEach(function(c){
          html += '<div class="room-comment">';
          html += '<div class="room-comment-meta">' + escapeHtml(c.author || '内勤') + '　' + formatDate(c.at) + '</div>';
          html += '<div class="room-comment-text">' + escapeHtml(c.text) + '</div>';
          html += '</div>';
        });
      }
      html += '</div>';
      html += '<div class="room-comment-input-row">';
      html += '<input type="text" class="room-comment-input" id="commentInput' + idx + '" placeholder="コメントを入力">';
      html += '<button class="room-comment-send" onclick="sendComment(\'' + room.roomId + '\',' + idx + ')">送信</button>';
      html += '</div>';

      html += '</div>'; // room-body

      html += '</div>'; // room-item
    });

    document.getElementById('roomList').innerHTML = html;
  }

  function renderAccordion(accId, title, doneCount, totalCount, innerHtml){
    var html = '<div class="accordion">';
    html += '<div class="accordion-header" onclick="toggleAccordion(\'' + accId + '\')">';
    html += '<span class="accordion-title">' + title + '</span>';
    html += '<span class="accordion-progress">' + doneCount + '/' + totalCount + '</span>';
    html += '<span class="accordion-caret" id="caret' + accId + '">▾</span>';
    html += '</div>';
    html += '<div class="accordion-body" id="acc' + accId + '">' + innerHtml + '</div>';
    html += '</div>';
    return html;
  }

  function toggleAccordion(accId){
    var body = document.getElementById('acc' + accId);
    var caret = document.getElementById('caret' + accId);
    if(body.classList.contains('show')){
      body.classList.remove('show');
      caret.textContent = '▾';
    } else {
      body.classList.add('show');
      caret.textContent = '▴';
    }
  }

  function toggleRoomAccordion(idx){
    var body = document.getElementById('roomBody' + idx);
    var caret = document.getElementById('roomCaret' + idx);
    if(body.classList.contains('show')){
      body.classList.remove('show');
      caret.textContent = '▾';
    } else {
      body.classList.add('show');
      caret.textContent = '▴';
    }
  }

  function renderTalkCheckItem(roomId, key, meta, state, isClosed, num){
    var color = meta.color || 'pink';
    var html = '<div class="talk-card talk-card-' + color + (state.done ? ' talk-card-done' : '') + '">';
    html += '<div class="talk-card-head">';
    html += '<span class="talk-card-badge">' + num + '</span>';
    html += '<span class="talk-card-title">' + escapeHtml(meta.label) + '</span>';
    if(state.done){
      html += '<span class="talk-card-done-mark">✓ 説明済み</span>';
    }
    html += '</div>';

    if(meta.points && meta.points.length){
      html += '<ul class="talk-card-points">';
      meta.points.forEach(function(p){
        html += '<li>' + escapeHtml(p) + '</li>';
      });
      html += '</ul>';
    }

    if(meta.detail){
      html += '<div class="talk-card-detail">' + meta.detail + '</div>';
    }

    if(meta.say){
      html += '<div class="talk-card-say">';
      html += '<div class="talk-card-say-label">💬 こう伝えるとよいです</div>';
      html += '<div class="talk-card-say-text">「' + escapeHtml(meta.say) + '」</div>';
      html += '</div>';
    }

    if(!isClosed){
      html += '<button class="talk-card-btn ' + (state.done ? 'talk-card-btn-undo' : 'talk-card-btn-done') + '" onclick="toggleTalkChecklist(\'' + roomId + '\',\'' + key + '\',' + (!state.done) + ', this)">' + (state.done ? '取り消す' : '説明し終えたらタップ') + '</button>';
    } else if(state.done){
      html += '<div class="talk-card-closed-note">説明済み</div>';
    }

    html += '</div>';
    return html;
  }

  function toggleTalkChecklist(roomId, key, done, btnEl){
    var room = lastRoomsData.find(function(r){ return r.roomId === roomId; });
    var prevState = room && room.talkChecklist && room.talkChecklist[key] ? room.talkChecklist[key].done : false;
    if(room){
      if(!room.talkChecklist) room.talkChecklist = {};
      room.talkChecklist[key] = { done: done, at: done ? new Date().toISOString() : '' };
    }

    // 楽観的更新：カード全体を即座に再描画する
    var cardEl = btnEl ? btnEl.closest('.talk-card') : null;
    if(cardEl){
      var meta = globalTalkChecklistMeta[key];
      var newCardHtml = renderTalkCheckItem(roomId, key, meta, room.talkChecklist[key], false, cardEl.querySelector('.talk-card-badge').textContent);
      var temp = document.createElement('div');
      temp.innerHTML = newCardHtml;
      cardEl.replaceWith(temp.firstElementChild);
    }
    updateAccordionProgressCounts();

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateTalkChecklist', id: roomId, key: key, done: done, token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          if(room) room.talkChecklist[key] = { done: prevState, at: '' };
          alert('更新に失敗しました：' + result.error);
          loadRooms();
          return;
        }
      })
      .catch(function(){
        if(room) room.talkChecklist[key] = { done: prevState, at: '' };
        alert('通信エラーが発生しました');
        loadRooms();
      });
  }

  function updateAccordionProgressCounts(){
    // 簡易的に全体を再描画せず、開いているアコーディオンの状態を保ったまま件数だけ更新したい場合はここを拡張。
    // 現状は次回のloadRoomsQuietlyで正しい値に揃うため、ここでは何もしない（体感速度優先で見た目のチェックは即時反映済み）。
  }

  function renderRoomCheckItem(roomId, key, meta, state, isClosed){
    var html = '<div class="room-check-item">';
    var canClick = !isClosed;
    if(canClick){
      html += '<div class="room-check-icon ' + (state.done ? 'done' : 'pending') + ' clickable" onclick="toggleStaffChecklist(\'' + roomId + '\',\'' + key + '\',' + (!state.done) + ', this)">' + (state.done ? '✓' : '') + '</div>';
    } else {
      html += '<div class="room-check-icon ' + (state.done ? 'done' : 'pending') + '">' + (state.done ? '✓' : '') + '</div>';
    }
    html += '<div class="room-check-label ' + (state.done ? 'done' : '') + '">' + escapeHtml(meta.label) + '</div>';
    var badgeText = meta.owner === 'cast' ? 'キャスト回答' : (meta.owner === 'staffOnly' ? '内勤専用' : 'キャストに表示');
    html += '<span class="room-check-ownerbadge ' + meta.owner + '">' + badgeText + '</span>';
    html += '</div>';
    return html;
  }

  function toggleRoomChecklist(idx){
    var el = document.getElementById('roomChecklist' + idx);
    el.classList.toggle('show');
  }

  function toggleStaffChecklist(roomId, key, done, iconEl){
    // 楽観的更新：即座に見た目を変える
    var room = lastRoomsData.find(function(r){ return r.roomId === roomId; });
    var prevState = room && room.checklist[key] ? room.checklist[key].done : false;
    if(room){
      room.checklist[key] = { done: done, at: done ? new Date().toISOString() : '' };
    }

    if(iconEl){
      iconEl.className = 'room-check-icon clickable ' + (done ? 'done' : 'pending');
      iconEl.textContent = done ? '✓' : '';
      iconEl.setAttribute('onclick', "toggleStaffChecklist('" + roomId + "','" + key + "'," + (!done) + ", this)");
      var labelEl = iconEl.nextElementSibling;
      if(labelEl){
        labelEl.className = 'room-check-label' + (done ? ' done' : '');
      }
    }

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateChecklist', id: roomId, key: key, done: done, isStaff: true, token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          if(room) room.checklist[key] = { done: prevState, at: '' };
          alert('更新に失敗しました：' + result.error);
          loadRooms();
          return;
        }
        // 成功時はバックグラウンドで一覧を静かに更新（進捗バーの数字などを合わせるため）
        loadRoomsQuietly();
      })
      .catch(function(){
        if(room) room.checklist[key] = { done: prevState, at: '' };
        alert('通信エラーが発生しました');
        loadRooms();
      });
  }

  function loadRoomsQuietly(){
    fetch(GAS_URL + '?action=listRooms&token=' + encodeURIComponent(savedToken))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error) return;
        globalChecklistMeta = data.checklistMeta || {};
        globalTalkChecklistMeta = data.talkChecklistMeta || {};
        globalStoreList = data.storeList || [];
        lastRoomsData = data.rooms || [];
        // 開いているアコーディオン・ルームカードの展開状態を保持したまま再描画
        var openIds = [];
        document.querySelectorAll('.accordion-body.show').forEach(function(el){
          openIds.push(el.id.replace('acc', ''));
        });
        var openRoomIdxs = [];
        document.querySelectorAll('.room-body.show').forEach(function(el){
          openRoomIdxs.push(el.id.replace('roomBody', ''));
        });
        renderRoomList(data.rooms);
        openIds.forEach(function(accId){
          var body = document.getElementById('acc' + accId);
          var caret = document.getElementById('caret' + accId);
          if(body){ body.classList.add('show'); }
          if(caret){ caret.textContent = '▴'; }
        });
        openRoomIdxs.forEach(function(idx){
          var body = document.getElementById('roomBody' + idx);
          var caret = document.getElementById('roomCaret' + idx);
          if(body){ body.classList.add('show'); }
          if(caret){ caret.textContent = '▴'; }
        });
      })
      .catch(function(){});
  }

  function sendComment(roomId, idx){
    var input = document.getElementById('commentInput' + idx);
    var text = input.value.trim();
    if(!text) return;

    input.value = '';
    input.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'addComment', id: roomId, text: text, author: '内勤', token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        input.disabled = false;
        if(result.error){
          alert('コメントの送信に失敗しました');
          input.value = text;
          return;
        }
        loadRoomsQuietly();
      })
      .catch(function(){
        input.disabled = false;
        alert('通信エラーが発生しました');
        input.value = text;
      });
  }

  function copyRoomUrl(url, btn){
    copyText(url, btn);
  }

  function closeRoom(roomId){
    if(!confirm('このルームを終了しますか？ 終了すると、キャストはこのページを開けなくなります。')){
      return;
    }
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'closeRoom', token: savedToken, id: roomId })
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error){
          alert('終了に失敗しました：' + data.error);
          return;
        }
        loadRooms();
      })
      .catch(function(){
        alert('通信エラーが発生しました');
      });
  }

  function deleteRoom(roomId){
    if(!confirm('このルームを完全に削除しますか？ この操作は取り消せません。')){
      return;
    }
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'deleteRoom', token: savedToken, id: roomId })
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error){
          alert('削除に失敗しました：' + data.error);
          return;
        }
        loadRooms();
      })
      .catch(function(){
        alert('通信エラーが発生しました');
      });
  }

  function formatDate(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ページを開いたときに、以前入力した合言葉が残っていれば自動で使う
  (function(){
    var stored = sessionStorage.getItem(STAFF_TOKEN_STORAGE_KEY);
    if(stored){
      document.getElementById('tokenInput').value = stored;
    }
  })();
</script>

</body>
