<style>
  :root{
    color-scheme: light;
    --bg:#FAF7F5;
    --pink:#F2A6B3;
    --pink-soft:#FDEDF0;
    --lav:#B9A6D9;
    --lav-soft:#F1EAFA;
    --mint:#7FC8AA;
    --mint-soft:#E6F6EE;
    --ink:#5C4B4F;
    --sub:#9C8B8F;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#FAF7F5 !important;
      --pink:#F2A6B3 !important;
      --pink-soft:#FDEDF0 !important;
      --lav:#B9A6D9 !important;
      --lav-soft:#F1EAFA !important;
      --mint:#7FC8AA !important;
      --mint-soft:#E6F6EE !important;
      --ink:#5C4B4F !important;
      --sub:#9C8B8F !important;
    }
    html, body{
      background:#FAF7F5 !important;
      color:#5C4B4F !important;
    }
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", Roboto, sans-serif;
    background:#FAF7F5 !important;
    color:#5C4B4F !important;
    line-height:1.7;
  }
  body{
    padding:24px 18px 60px;
    max-width:640px;
    margin:0 auto;
  }
  .header{ text-align:center; margin-bottom:22px; }
  .confidential-badge{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    color:#fff;
    background:#D9333F;
    padding:4px 14px;
    border-radius:99px;
    margin-bottom:10px;
    letter-spacing:0.05em;
  }
  .kicker{
    display:inline-block;
    font-size:12.5px;
    color:#fff;
    background:var(--pink);
    font-weight:800;
    padding:4px 16px;
    border-radius:99px;
  }
  h1{ font-size:21px; margin:10px 0 6px; font-weight:800; color:#5C4B4F; }
  .lead{ font-size:12.5px; color:var(--sub); }

  .card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(217,160,180,.14);
  }
  .card-title{ font-size:15px; font-weight:800; margin-bottom:14px; color:#5C4B4F; }
  .card-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .card-title-row .card-title{ margin-bottom:0; }
  .btn-refresh{
    border:none;
    background:var(--mint-soft);
    color:#2c5b45;
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:7px 14px;
    border-radius:99px;
    cursor:pointer;
  }

  label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    margin:12px 0 5px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=number], input[type=password]{
    width:100%;
    padding:10px 13px;
    border:1.5px solid #eee;
    border-radius:11px;
    font-size:14px;
    font-family:inherit;
    background:#FAF8F6;
    color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--pink); background:#fff; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .rank-select-row{ display:flex; gap:7px; }
  .rank-btn{
    flex:1;
    border:1.5px solid #eee;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-weight:800;
    font-size:14px;
    padding:11px 0;
    border-radius:11px;
    cursor:pointer;
  }
  .rank-btn.selected{ border-color:var(--pink); background:var(--pink-soft); color:#c9556a; }
  .rank-select-note{
    font-size:11px;
    color:var(--sub);
    margin:6px 0 4px;
  }

  .store-checkbox-group{
    background:#FAF8F6;
    border-radius:11px;
    padding:10px 13px;
    margin-bottom:6px;
  }
  .store-group-label{
    font-size:10.5px;
    font-weight:800;
    color:var(--sub);
    margin:8px 0 4px;
  }
  .store-group-label:first-child{ margin-top:0; }
  .store-checkbox-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--ink);
    padding:4px 0;
    cursor:pointer;
  }
  .store-checkbox-item input[type=checkbox]{
    width:16px; height:16px;
    accent-color:var(--pink);
  }
  .store-back-fields{
    background:var(--pink-soft);
    border-radius:11px;
    padding:12px 13px 4px;
    margin-bottom:6px;
  }

  .btn{
    width:100%;
    border:none;
    background:var(--pink);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:14.5px;
    padding:13px;
    border-radius:99px;
    cursor:pointer;
    margin-top:16px;
  }
  .btn:hover{ background:#e8909f; }
  .btn:disabled{ background:#ddd; cursor:not-allowed; }

    <div class="card-title-row">
      <div class="card-title">ルーム一覧</div>
      <button class="btn-refresh" onclick="loadRooms()">🔄 更新</button>
    </div>
    <div id="roomList"><div class="empty">読み込んでいます...</div></div>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxKWQsxsX2SJ0cZ7YfxZJgW1ujmM8xRvrNcjcDYpohI6Gqkem1BhiqVO0PcU8KjjMnf/exec';
  var STAFF_TOKEN_STORAGE_KEY = 'onboarding_room_token';
  var savedToken = null;
  var lastCreatedUrl = '';

  function showLoading(){
    var el = document.getElementById('loadingOverlay');
    if(el) el.classList.add('show');
  }
  function hideLoading(){
    var el = document.getElementById('loadingOverlay');
    if(el) el.classList.remove('show');
  }

  var STORE_LIST_LOCAL = [
    { key: 'sakuramoon',  label: 'サクラムーン',         group: 'basic', defaultChecked: true },
    { key: 'lanauguisu',  label: 'ラナ鶯谷',             group: 'basic', defaultChecked: true },
    { key: 'lanakinshi',  label: 'ラナ錦糸町',           group: 'basic', defaultChecked: true },
    { key: 'peachmoon',   label: 'ピーチムーン五反田',   group: 'basic', defaultChecked: true },
    { key: 'dressgarden', label: 'ドレスガーデン渋谷',   group: 'basic', defaultChecked: true },
    { key: 'cutie',       label: 'キューティキューティ', group: 'other', defaultChecked: false },
    { key: 'gyakuanal',   label: '逆アナル倶楽部',       group: 'other', defaultChecked: false },
    { key: 'gokumon',     label: '極門',                 group: 'other', defaultChecked: false }
  ];

  // 内勤コメントの投稿者選択肢
  var COMMENT_AUTHORS_LOCAL = ['きゃ', 'すや', 'らん', 'わか', 'かみ'];

  // サクラ・ラナ系のランク別バックプリセット（60分・90分・120分）
  var RANK_PRESETS_LOCAL = {
    SS: { back60: 10000, back90: 15000, back120: 19000 },
    S:  { back60: 9000,  back90: 12000, back120: 16000 },
    A:  { back60: 8000,  back90: 11000, back120: 14000 },
    B:  { back60: 7000,  back90: 10000, back120: 13000 },
    C:  { back60: 6000,  back90: 9000,  back120: 12000 }
  };

  // バック金額（60分・90分・120分）から、一致するランクを逆算する。一致しなければnull。
  function detectRank(back60, back90, back120){
    var b60 = Number(back60), b90 = Number(back90), b120 = Number(back120);
    for(var rank in RANK_PRESETS_LOCAL){
      var p = RANK_PRESETS_LOCAL[rank];
      if(p.back60 === b60 && p.back90 === b90 && p.back120 === b120){
        return rank;
      }
    }
    return null;
  }

  // 本指名バックの自動計算：A・S・SSは60分+500円／90分以上+1000円、B・Cは一律+1000円
  function calcHonshimei(rank, back60, back90){
    var isHighRank = (rank === 'A' || rank === 'S' || rank === 'SS');
    var add60 = isHighRank ? 500 : 1000;
    var add90 = 1000; // 90分以上はどのランクも+1000円
    return {
      honshimei60: back60 + add60,
      honshimei90: back90 + add90
    };
  }

  function applyRankPreset(rank, btnEl){
    var preset = RANK_PRESETS_LOCAL[rank];
    if(!preset) return;

    document.getElementById('newB60').value = preset.back60;
    document.getElementById('newB90').value = preset.back90;
    document.getElementById('newB120').value = preset.back120;

    var honshimei = calcHonshimei(rank, preset.back60, preset.back90);
    document.getElementById('newBh60').value = honshimei.honshimei60;
    document.getElementById('newBh90').value = honshimei.honshimei90;

    // 選択中のランクボタンを見た目で分かるようにする
    document.querySelectorAll('#rankSelectRow .rank-btn').forEach(function(b){
      b.classList.remove('selected');
    });
    if(btnEl) btnEl.classList.add('selected');
  }

  function renderStoreCheckboxes(){
    var html = '';
    var basicStores = STORE_LIST_LOCAL.filter(function(s){ return s.group === 'basic'; });
    var otherStores = STORE_LIST_LOCAL.filter(function(s){ return s.group === 'other'; });

    html += '<div class="store-group-label">基本店舗</div>';
    basicStores.forEach(function(s){
      html += '<label class="store-checkbox-item">';
      html += '<input type="checkbox" id="store_' + s.key + '" ' + (s.defaultChecked ? 'checked' : '') + ' onchange="onStoreCheckChange()">';
      html += '<span>' + s.label + '</span>';
      html += '</label>';
    });
    html += '<div class="store-group-label">その他店舗</div>';
    otherStores.forEach(function(s){
      html += '<label class="store-checkbox-item">';
      html += '<input type="checkbox" id="store_' + s.key + '" ' + (s.defaultChecked ? 'checked' : '') + ' onchange="onStoreCheckChange()">';
      html += '<span>' + s.label + '</span>';
      html += '</label>';
    });

    document.getElementById('storeCheckboxes').innerHTML = html;
  }

  function onStoreCheckChange(){
    var cutieChecked = document.getElementById('store_cutie').checked;
    var gokumonChecked = document.getElementById('store_gokumon').checked;
    document.getElementById('cutieBackFields').style.display = cutieChecked ? 'block' : 'none';
    document.getElementById('gokumonBackFields').style.display = gokumonChecked ? 'block' : 'none';
  }

  function getSelectedStores(){
    var result = {};
    STORE_LIST_LOCAL.forEach(function(s){
      var el = document.getElementById('store_' + s.key);
      result[s.key] = el ? el.checked : false;
    });
    return result;
  }

  function checkToken(){
    var token = document.getElementById('tokenInput').value.trim();
    if(!token){
      alert('合言葉を入力してください');
      return;
    }

    var loginBtn = document.getElementById('loginBtn');
    if(loginBtn){
      loginBtn.disabled = true;
      loginBtn.textContent = '確認中...';
    }
    showLoading();

    fetch(GAS_URL + '?action=checkToken&token=' + encodeURIComponent(token))
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(loginBtn){
          loginBtn.disabled = false;
          loginBtn.textContent = '開く';
        }
        if(!result.valid){
          hideLoading();
          alert('合言葉が違います');
          return;
        }
        savedToken = token;
        sessionStorage.setItem(STAFF_TOKEN_STORAGE_KEY, token);
        document.getElementById('tokenGate').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        renderStoreCheckboxes();
        loadRooms();
      })
      .catch(function(){
        hideLoading();
        if(loginBtn){
          loginBtn.disabled = false;
          loginBtn.textContent = '開く';
        }
        alert('通信エラーが発生しました。時間をおいて再度お試しください。');
      });
  }

  function createRoom(){
    var name = document.getElementById('newName').value.trim();
    if(!name){
      var now = new Date();
      var stamp = (now.getMonth()+1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      name = '新人キャスト（' + stamp + '作成）';
    }

    var stores = getSelectedStores();

    var body = {
      action: 'createRoom',
      token: savedToken,
      castName: name,
      back60: document.getElementById('newB60').value.trim(),
      back90: document.getElementById('newB90').value.trim(),
      back120: document.getElementById('newB120').value.trim(),
      backHonshimei60: document.getElementById('newBh60').value.trim(),
      backHonshimei90: document.getElementById('newBh90').value.trim(),
      stores: stores
    };

    if(stores.cutie){
      body.backCutie60 = document.getElementById('newCutie60').value.trim();
      body.backCutie90 = document.getElementById('newCutie90').value.trim();
      body.backCutie120 = document.getElementById('newCutie120').value.trim();
      body.backCutieHonshimei60 = document.getElementById('newCutieHonshimei60').value.trim();
      body.backCutieHonshimei90 = document.getElementById('newCutieHonshimei90').value.trim();
    }
    if(stores.gokumon){
      body.backGokumon60 = document.getElementById('newGokumon60').value.trim();
      body.backGokumon90 = document.getElementById('newGokumon90').value.trim();
      body.backGokumon120 = document.getElementById('newGokumon120').value.trim();
      body.backGokumonHonshimei60 = document.getElementById('newGokumonHonshimei60').value.trim();
      body.backGokumonHonshimei90 = document.getElementById('newGokumonHonshimei90').value.trim();
    }

    var btn = document.getElementById('createBtn');
    btn.disabled = true;
    btn.textContent = '作成中...';
    showLoading();

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(body)
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        btn.disabled = false;
        btn.textContent = 'ルームを作成';
        if(data.error){
          hideLoading();
          alert('作成に失敗しました：' + data.error);
          return;
        }
        var baseUrl = window.location.href.replace('staff.html', 'index.html').split('?')[0];
        lastCreatedUrl = baseUrl + '?id=' + data.roomId;
        document.getElementById('createUrl').textContent = lastCreatedUrl;
        document.getElementById('createResult').classList.add('show');
        document.getElementById('copyBtn').textContent = 'URLをコピー';

        // フォームをクリア
        document.getElementById('newName').value = '';
        document.getElementById('newB60').value = '';
        document.getElementById('newB90').value = '';
        document.getElementById('newB120').value = '';
        document.getElementById('newBh60').value = '';
        document.getElementById('newBh90').value = '';
        document.getElementById('newCutie60').value = '';
        document.getElementById('newCutie90').value = '';
        document.getElementById('newCutie120').value = '';
        document.getElementById('newCutieHonshimei60').value = '';
        document.getElementById('newCutieHonshimei90').value = '';
        document.getElementById('newGokumon60').value = '';
        document.getElementById('newGokumon90').value = '';
        document.getElementById('newGokumon120').value = '';
        document.getElementById('newGokumonHonshimei60').value = '';
        document.getElementById('newGokumonHonshimei90').value = '';
        renderStoreCheckboxes();

        loadRooms();
      })
      .catch(function(){
        hideLoading();
        btn.disabled = false;
        btn.textContent = 'ルームを作成';
        alert('通信エラーが発生しました');
      });
  }

  function copyCreatedUrl(){
    copyText(lastCreatedUrl, document.getElementById('copyBtn'));
  }

  function copyText(text, btn){
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        btn.textContent = 'コピーしました';
      }).catch(function(){ fallbackCopy(text, btn); });
    } else {
      fallbackCopy(text, btn);
    }
  }

  function fallbackCopy(text, btn){
    var temp = document.createElement('textarea');
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    try{
      document.execCommand('copy');
      btn.textContent = 'コピーしました';
    }catch(e){
      alert('コピーに失敗しました');
    }
    document.body.removeChild(temp);
  }

  var globalChecklistMeta = {};
  var globalTalkChecklistMeta = {};
  var globalStoreList = [];
  var lastRoomsData = [];

  function loadRooms(){
    showLoading();
    fetch(GAS_URL + '?action=listRooms&token=' + encodeURIComponent(savedToken))
      .then(function(res){ return res.json(); })
      .then(function(data){
        hideLoading();
        if(data.error){
          document.getElementById('roomList').innerHTML = '<div class="empty">読み込みに失敗しました：' + data.error + '</div>';
          return;
        }
        globalChecklistMeta = data.checklistMeta || {};
        globalTalkChecklistMeta = data.talkChecklistMeta || {};
        globalStoreList = data.storeList || [];
        lastRoomsData = data.rooms || [];
        renderRoomList(data.rooms);
      })
      .catch(function(){
        hideLoading();
        document.getElementById('roomList').innerHTML = '<div class="empty">通信エラーが発生しました</div>';
      });
  }

  function renderRoomList(rooms){
    if(!rooms || rooms.length === 0){
      document.getElementById('roomList').innerHTML = '<div class="empty">まだルームがありません</div>';
      return;
    }

    var baseUrl = window.location.href.replace('staff.html', 'index.html').split('?')[0];
    var metaKeys = Object.keys(globalChecklistMeta);
    var talkKeys = Object.keys(globalTalkChecklistMeta);

    var activeRooms = [];
    var closedRooms = [];
    rooms.forEach(function(room, idx){
      if(room.status === 'active'){
        activeRooms.push(idx);
      } else {
        closedRooms.push(idx);
      }
    });

    var html = '';

    html += '<div class="room-group-header" onclick="toggleRoomGroup(\'active\')">';
    html += '<span class="room-group-title">🟢 稼働中</span>';
    html += '<span class="room-group-count">' + activeRooms.length + '件</span>';
    html += '<span class="room-group-caret" id="groupCaretActive">▴</span>';
    html += '</div>';
    html += '<div class="room-group-body show" id="groupBodyActive">';
    if(activeRooms.length === 0){
      html += '<div class="empty">稼働中のルームはありません</div>';
    } else {
      activeRooms.forEach(function(idx){
        html += renderRoomCard(rooms[idx], idx, baseUrl, metaKeys, talkKeys);
      });
    }
    html += '</div>';

    html += '<div class="room-group-header" onclick="toggleRoomGroup(\'closed\')">';
    html += '<span class="room-group-title">⚪ 終了済み</span>';
    html += '<span class="room-group-count">' + closedRooms.length + '件</span>';
    html += '<span class="room-group-caret" id="groupCaretClosed">▾</span>';
    html += '</div>';
    html += '<div class="room-group-body" id="groupBodyClosed">';
    if(closedRooms.length === 0){
      html += '<div class="empty">終了済みのルームはありません</div>';
    } else {
      closedRooms.forEach(function(idx){
        html += renderRoomCard(rooms[idx], idx, baseUrl, metaKeys, talkKeys);
      });
    }
    html += '</div>';

    document.getElementById('roomList').innerHTML = html;
  }

  function toggleRoomGroup(group){
    var body = document.getElementById('groupBody' + (group === 'active' ? 'Active' : 'Closed'));
    var caret = document.getElementById('groupCaret' + (group === 'active' ? 'Active' : 'Closed'));
    if(body.classList.contains('show')){
      body.classList.remove('show');
      caret.textContent = '▾';
    } else {
      body.classList.add('show');
      caret.textContent = '▴';
    }
  }

  function renderRoomCard(room, idx, baseUrl, metaKeys, talkKeys){
      var isClosed = room.status !== 'active';
      var url = baseUrl + '?id=' + room.roomId;
      var checklist = room.checklist || {};
      var talkChecklist = room.talkChecklist || {};

      var doneCount = metaKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;
      var pct = metaKeys.length ? Math.round(doneCount / metaKeys.length * 100) : 0;

      var talkDoneCount = talkKeys.filter(function(k){ return talkChecklist[k] && talkChecklist[k].done; }).length;

      var castKeys = metaKeys.filter(function(k){ return globalChecklistMeta[k].owner !== 'staffOnly'; });
      var staffOnlyKeys = metaKeys.filter(function(k){ return globalChecklistMeta[k].owner === 'staffOnly'; });
      var castDoneCount = castKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;
      var staffOnlyDoneCount = staffOnlyKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;

      var html = '';
      html += '<div class="room-item' + (isClosed ? ' closed' : '') + '" id="roomItem' + idx + '">';
      html += '<div class="room-header" onclick="toggleRoomAccordion(' + idx + ')">';
      html += '<div class="room-header-main">';
      html += '<div class="room-name">' + escapeHtml(room.castName || '（名称未設定）') +
        '<span class="badge ' + (isClosed ? 'closed' : 'active') + '">' + (isClosed ? '終了済み' : '稼働中') + '</span></div>';
      html += '<div class="room-meta">作成：' + formatDate(room.createdAt) + (isClosed ? ' ／ 終了：' + formatDate(room.closedAt) : '') + '　／　全体進捗 ' + doneCount + '/' + metaKeys.length + '</div>';
      html += '<div class="room-progress-track"><div class="room-progress-fill" style="width:' + pct + '%;"></div></div>';
      html += '</div>';
      html += '<span class="room-caret" id="roomCaret' + idx + '">▾</span>';
      html += '</div>';

      html += '<div class="room-body" id="roomBody' + idx + '">';

      html += '<div class="room-actions">';
      html += '<button class="btn-copy" onclick="copyRoomUrl(\'' + url + '\', this)">URLをコピー</button>';
      if(!isClosed){
        html += '<button class="btn-edit" onclick="openEditRoom(' + idx + ')">✏️ 編集する</button>';
        html += '<button class="btn-close" onclick="closeRoom(\'' + room.roomId + '\')">終了する</button>';
      } else {
        html += '<button class="btn-delete" onclick="deleteRoom(\'' + room.roomId + '\')">削除する</button>';
      }
      html += '</div>';

      html += '<div class="edit-room-form" id="editForm' + idx + '" style="display:none;"></div>';

      html += '<div id="roomCaptureArea' + idx + '">';

      // キャストの選択内容
      var kit = room.kitChoice || {};
      var wig = room.wigChoice || {};
      var costumeUrls = room.costumeUrls || [];
      var stores = room.stores || {};

      // バック情報（ランク表示）
      var rank = detectRank(room.back60, room.back90, room.back120);
      html += '<div class="room-back-info">';
      html += '<div class="room-choice-title">バック情報</div>';
      if(rank){
        html += '<div class="room-rank-badge">' + rank + 'ランク</div>';
      } else {
        html += '<div class="room-rank-badge room-rank-badge-other">ランク外（個別設定）</div>';
      }
      html += '<div class="room-choice-row"><span>60分</span><span class="room-choice-val">' + formatYenLocal(room.back60) + '</span></div>';
      html += '<div class="room-choice-row"><span>90分</span><span class="room-choice-val">' + formatYenLocal(room.back90) + '</span></div>';
      html += '<div class="room-choice-row"><span>120分</span><span class="room-choice-val">' + formatYenLocal(room.back120) + '</span></div>';
      html += '<div class="room-choice-row"><span>本指名60分</span><span class="room-choice-val">' + formatYenLocal(room.backHonshimei60) + '</span></div>';
      html += '<div class="room-choice-row"><span>本指名90分以上</span><span class="room-choice-val">' + formatYenLocal(room.backHonshimei90) + '</span></div>';
      html += '</div>';

      html += '<div class="room-choices">';
      html += '<div class="room-choice-title">キャストの選択内容</div>';
      html += '<div class="room-choice-row"><span>お仕事セット</span><span class="room-choice-val">' + (kit.type === 'shop' ? '事務所で購入' : (kit.type === 'own' ? '自分で用意' : '未回答')) + '</span></div>';
      var wigText = '未回答';
      if(wig.type === 'wig') wigText = 'ウィッグを使う';
      else if(wig.type === 'jimoto') wigText = '地毛（ヘアメイク：' + (wig.hairMake === true ? '行く' : (wig.hairMake === false ? '行かない' : '未回答')) + '）';
      html += '<div class="room-choice-row"><span>ウィッグ/地毛</span><span class="room-choice-val">' + wigText + '</span></div>';

      var storeNames = (globalStoreList || []).filter(function(s){ return stores[s.key]; }).map(function(s){ return s.label; });
      html += '<div class="room-choice-row"><span>在籍店舗</span><span class="room-choice-val">' + (storeNames.length ? escapeHtml(storeNames.join('、')) : '未設定') + '</span></div>';
      html += '<div class="room-choice-row"><span>メールアドレス</span><span class="room-choice-val">' + (room.email ? escapeHtml(room.email) : '未入力') + '</span></div>';

      html += '<a class="profile-link-btn" href="https://sakuramoong-app.github.io/cast-sakura-profile/staff.html" target="_blank">📋 在籍プロフィール管理ページを開く</a>';

      var hasCostume = costumeUrls.some(function(u){ return !!u; });
      if(hasCostume){
        html += '<div class="room-costume-label">衣装の写真</div>';
        html += '<div class="room-costume-grid">';
        for(var ci=0; ci<3; ci++){
          if(costumeUrls[ci]){
            html += '<a href="' + costumeUrls[ci] + '" target="_blank"><img src="' + costumeUrls[ci] + '" class="room-costume-thumb" alt="衣装' + (ci+1) + '" onerror="this.src=\'\'; this.alt=\'表示不可\'; this.classList.add(\'thumb-error\');"></a>';
          }
        }
        html += '</div>';
      }
      html += '</div>';

      // 内勤からキャストへのお知らせ
      var noticeText = room.notice || '';
      html += '<div class="room-notice-box">';
      html += '<div class="room-notice-title">📢 キャストへのお知らせ</div>';
      html += '<p class="room-notice-desc">ここに入力すると、キャストの画面に表示されます。</p>';
      html += '<textarea class="room-notice-textarea" id="noticeInput' + idx + '" placeholder="例：撮影の日程が決まりました！詳しくはコメントを確認してください">' + escapeHtml(noticeText) + '</textarea>';
      html += '<button class="room-notice-save-btn" onclick="saveNotice(\'' + room.roomId + '\',' + idx + ')">お知らせを保存</button>';
      html += '<div class="save-note" id="noticeSaveNote' + idx + '"></div>';
      html += '</div>';

      // アコーディオン1：口頭説明チェックリスト
      html += renderAccordion('talk' + idx, '📋 口頭説明チェックリスト', talkDoneCount, talkKeys.length, (function(){
        var inner = '';
        talkKeys.forEach(function(key, tIdx){
          var meta = globalTalkChecklistMeta[key];
          var state = talkChecklist[key] || { done: false };
          inner += renderTalkCheckItem(room.roomId, key, meta, state, isClosed, tIdx + 1);
        });
        return inner;
      })());

      // アコーディオン2：やることリスト（キャストにも表示）
      html += renderAccordion('cast' + idx, '✅ やることリスト（キャストにも表示）', castDoneCount, castKeys.length, (function(){
        var inner = '';
        castKeys.forEach(function(key){
          var meta = globalChecklistMeta[key];
          var state = checklist[key] || { done: false };
          inner += renderRoomCheckItem(room.roomId, key, meta, state, isClosed);
        });
        return inner;
      })());

      // アコーディオン3：内勤チェック（キャストには見えません）
      html += renderAccordion('staffonly' + idx, '🔒 内勤チェック（キャストには見えません）', staffOnlyDoneCount, staffOnlyKeys.length, (function(){
        var inner = '';
        staffOnlyKeys.forEach(function(key){
          var meta = globalChecklistMeta[key];
          var state = checklist[key] || { done: false };
          inner += renderRoomCheckItem(room.roomId, key, meta, state, isClosed);
        });
        return inner;
      })());

      // コメント
      var comments = room.comments || [];
      html += '<div class="room-checklist-group-title">コメント</div>';
      html += '<div class="room-comments" id="roomComments' + idx + '">';
      if(comments.length === 0){
        html += '<div class="room-comment-empty">まだコメントはありません</div>';
      } else {
        var displayOrder = comments.map(function(c, i){ return { comment: c, originalIndex: i }; }).reverse();
        displayOrder.forEach(function(item){

  function toggleTalkChecklist(roomId, key, done, btnEl){
    var room = lastRoomsData.find(function(r){ return r.roomId === roomId; });
    var prevState = room && room.talkChecklist && room.talkChecklist[key] ? room.talkChecklist[key].done : false;
    if(room){
      if(!room.talkChecklist) room.talkChecklist = {};
      room.talkChecklist[key] = { done: done, at: done ? new Date().toISOString() : '' };
    }

    // 楽観的更新：カード全体を即座に再描画する
    var cardEl = btnEl ? btnEl.closest('.talk-card') : null;
    if(cardEl){
      var meta = globalTalkChecklistMeta[key];
      var newCardHtml = renderTalkCheckItem(roomId, key, meta, room.talkChecklist[key], false, cardEl.querySelector('.talk-card-badge').textContent);
      var temp = document.createElement('div');
      temp.innerHTML = newCardHtml;
      cardEl.replaceWith(temp.firstElementChild);
    }
    updateAccordionProgressCounts();

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateTalkChecklist', id: roomId, key: key, done: done, token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          if(room) room.talkChecklist[key] = { done: prevState, at: '' };
          alert('更新に失敗しました：' + result.error);
          loadRooms();
          return;
        }
      })
      .catch(function(){
        if(room) room.talkChecklist[key] = { done: prevState, at: '' };
        alert('通信エラーが発生しました');
        loadRooms();
      });
  }

  function updateAccordionProgressCounts(){
    // 全件再取得はせず、既にローカルにある lastRoomsData から進捗を再計算し、
    // 該当する数字・バーの表示だけをその場で書き換える（軽量・高速）。
    var metaKeys = Object.keys(globalChecklistMeta);
    var castKeys = metaKeys.filter(function(k){ return globalChecklistMeta[k].owner !== 'staffOnly'; });
    var staffOnlyKeys = metaKeys.filter(function(k){ return globalChecklistMeta[k].owner === 'staffOnly'; });

    lastRoomsData.forEach(function(room, idx){
      var checklist = room.checklist || {};
      var doneCount = metaKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;
      var pct = metaKeys.length ? Math.round(doneCount / metaKeys.length * 100) : 0;
      var castDoneCount = castKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;
      var staffOnlyDoneCount = staffOnlyKeys.filter(function(k){ return checklist[k] && checklist[k].done; }).length;

      var roomItem = document.getElementById('roomItem' + idx);
      if(!roomItem) return;

      var metaEl = roomItem.querySelector('.room-meta');
      if(metaEl){
        var isClosed = room.status !== 'active';
        metaEl.textContent = '作成：' + formatDate(room.createdAt) + (isClosed ? ' ／ 終了：' + formatDate(room.closedAt) : '') + '　／　全体進捗 ' + doneCount + '/' + metaKeys.length;
      }
      var fillEl = roomItem.querySelector('.room-progress-fill');
      if(fillEl){
        fillEl.style.width = pct + '%';
      }

      var castProgress = document.getElementById('accordion-progress-cast' + idx);
      if(castProgress){
        castProgress.textContent = castDoneCount + '/' + castKeys.length;
      }
      var staffOnlyProgress = document.getElementById('accordion-progress-staffonly' + idx);
      if(staffOnlyProgress){
        staffOnlyProgress.textContent = staffOnlyDoneCount + '/' + staffOnlyKeys.length;
      }
    });
  }

  function toggleStaffChecklist(roomId, key, done, iconEl){
    // 楽観的更新：即座に見た目を変える
    var room = lastRoomsData.find(function(r){ return r.roomId === roomId; });
    var prevState = room && room.checklist[key] ? room.checklist[key].done : false;
    if(room){
      room.checklist[key] = { done: done, at: done ? new Date().toISOString() : '' };
    }

    if(iconEl){
      iconEl.className = 'room-check-icon clickable ' + (done ? 'done' : 'pending');
      iconEl.textContent = done ? '✓' : '';
      iconEl.setAttribute('onclick', "toggleStaffChecklist('" + roomId + "','" + key + "'," + (!done) + ", this)");
      var labelEl = iconEl.nextElementSibling;
      if(labelEl){
        labelEl.className = 'room-check-label' + (done ? ' done' : '');
      }
    }

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateChecklist', id: roomId, key: key, done: done, isStaff: true, token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          if(room) room.checklist[key] = { done: prevState, at: '' };
          alert('更新に失敗しました：' + result.error);
          loadRooms();
          return;
        }
        // サーバーの最新checklistをローカルに反映し、進捗数だけ軽量に更新する（全件再取得はしない）
        if(room && result.checklist){
          room.checklist = result.checklist;
        }
        updateAccordionProgressCounts();
      })
      .catch(function(){
        if(room) room.checklist[key] = { done: prevState, at: '' };
        alert('通信エラーが発生しました');
        loadRooms();
      });
  }

  function loadRoomsQuietly(){
    fetch(GAS_URL + '?action=listRooms&token=' + encodeURIComponent(savedToken))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error) return;
        globalChecklistMeta = data.checklistMeta || {};
        globalTalkChecklistMeta = data.talkChecklistMeta || {};
        globalStoreList = data.storeList || [];
        lastRoomsData = data.rooms || [];
        // 開いているアコーディオン・ルームカードの展開状態を保持したまま再描画
        var openIds = [];
        document.querySelectorAll('.accordion-body.show').forEach(function(el){
          openIds.push(el.id.replace('acc', ''));
        });
        var openRoomIdxs = [];
        document.querySelectorAll('.room-body.show').forEach(function(el){
          openRoomIdxs.push(el.id.replace('roomBody', ''));
        });
        var closedGroupClosed = document.getElementById('groupBodyClosed') && !document.getElementById('groupBodyClosed').classList.contains('show');
        var activeGroupClosed = document.getElementById('groupBodyActive') && !document.getElementById('groupBodyActive').classList.contains('show');
        renderRoomList(data.rooms);
        if(closedGroupClosed){
          var cb = document.getElementById('groupBodyClosed');
          var cc = document.getElementById('groupCaretClosed');
          if(cb){ cb.classList.remove('show'); }
          if(cc){ cc.textContent = '▾'; }
        }
        if(activeGroupClosed){
          var ab = document.getElementById('groupBodyActive');
          var ac = document.getElementById('groupCaretActive');
          if(ab){ ab.classList.remove('show'); }
          if(ac){ ac.textContent = '▾'; }
        }
        openIds.forEach(function(accId){
          var body = document.getElementById('acc' + accId);
          var caret = document.getElementById('caret' + accId);
          if(body){ body.classList.add('show'); }
          if(caret){ caret.textContent = '▴'; }
        });
        openRoomIdxs.forEach(function(idx){
          var body = document.getElementById('roomBody' + idx);
          var caret = document.getElementById('roomCaret' + idx);
          if(body){ body.classList.add('show'); }
          if(caret){ caret.textContent = '▴'; }
        });
      })
      .catch(function(){});
  }

  function sendComment(roomId, idx){
    var input = document.getElementById('commentInput' + idx);
    var authorSelect = document.getElementById('commentAuthor' + idx);
    var text = input.value.trim();
    if(!text) return;

    var author = authorSelect ? authorSelect.value : '内勤';

    input.value = '';
    input.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'addComment', id: roomId, text: text, author: author, token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        input.disabled = false;
        if(result.error){
          alert('コメントの送信に失敗しました');
          input.value = text;
          return;
        }
        loadRoomsQuietly();
      })
      .catch(function(){
        input.disabled = false;
        alert('通信エラーが発生しました');
        input.value = text;
      });
  }

  function cancelEditComment(idx, origIdx){
    var viewEl = document.getElementById('commentView_' + idx + '_' + origIdx);
    var editEl = document.getElementById('commentEdit_' + idx + '_' + origIdx);
    if(viewEl) viewEl.style.display = 'block';
    if(editEl) editEl.style.display = 'none';

  function saveEditComment(roomId, idx, origIdx){
    var textarea = document.getElementById('commentEditText_' + idx + '_' + origIdx);
    var text = textarea.value.trim();
    if(!text){
      alert('コメントを入力してください');
      return;
    }

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'editComment', id: roomId, index: origIdx, text: text, token: savedToken })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          alert('コメントの編集に失敗しました：' + result.error);
          return;
        }
        var room = lastRoomsData.find(function(r){ return r.roomId === roomId; });
        if(room) room.comments = result.comments;
        loadRoomsQuietly();
      })
      .catch(function(){
        alert('通信エラーが発生しました');
      });
  }

    document.getElementById('editB90_' + idx).value = preset.back90;
    document.getElementById('editB120_' + idx).value = preset.back120;

    var honshimei = calcHonshimei(rank, preset.back60, preset.back90);
    document.getElementById('editBh60_' + idx).value = honshimei.honshimei60;
    document.getElementById('editBh90_' + idx).value = honshimei.honshimei90;

      row.querySelectorAll('.rank-btn').forEach(function(b){ b.classList.remove('selected'); });
    }
    if(btnEl) btnEl.classList.add('selected');
  }

  function saveEditRoom(idx){
    var room = lastRoomsData[idx];
    if(!room) return;

    var stores = {};
    STORE_LIST_LOCAL.forEach(function(s){
      var el = document.getElementById('editStore_' + s.key + '_' + idx);
      stores[s.key] = el ? el.checked : false;
    });

    var body = {
      action: 'editRoom',
      token: savedToken,
      id: room.roomId,
      castName: document.getElementById('editName' + idx).value.trim(),
      back60: document.getElementById('editB60_' + idx).value.trim(),
      back90: document.getElementById('editB90_' + idx).value.trim(),
      back120: document.getElementById('editB120_' + idx).value.trim(),
      backHonshimei60: document.getElementById('editBh60_' + idx).value.trim(),
      backHonshimei90: document.getElementById('editBh90_' + idx).value.trim(),
      stores: stores
    };

    if(stores.cutie){
      body.backCutie60 = document.getElementById('editCutie60_' + idx).value.trim();
      body.backCutie90 = document.getElementById('editCutie90_' + idx).value.trim();
      body.backCutie120 = document.getElementById('editCutie120_' + idx).value.trim();
      body.backCutieHonshimei60 = document.getElementById('editCutieHonshimei60_' + idx).value.trim();
      body.backCutieHonshimei90 = document.getElementById('editCutieHonshimei90_' + idx).value.trim();
    }
    if(stores.gokumon){
      body.backGokumon60 = document.getElementById('editGokumon60_' + idx).value.trim();
      body.backGokumon90 = document.getElementById('editGokumon90_' + idx).value.trim();
      body.backGokumon120 = document.getElementById('editGokumon120_' + idx).value.trim();
      body.backGokumonHonshimei60 = document.getElementById('editGokumonHonshimei60_' + idx).value.trim();
      body.backGokumonHonshimei90 = document.getElementById('editGokumonHonshimei90_' + idx).value.trim();
    }

    showLoading();
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(body)
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          hideLoading();
          alert('保存に失敗しました：' + result.error);
          return;
        }
        loadRooms();
      })
      .catch(function(){
        hideLoading();
        alert('通信エラーが発生しました');
      });
  }

  function saveNotice(roomId, idx){
    var textarea = document.getElementById('noticeInput' + idx);
    var note = document.getElementById('noticeSaveNote' + idx);
    var notice = textarea.value;

    note.textContent = '保存中...';
    note.style.color = '#9C8B8F';

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'setNotice', token: savedToken, id: roomId, notice: notice })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          note.textContent = '保存に失敗しました';
          note.style.color = '#c9556a';
          return;
        }
        var room = lastRoomsData.find(function(r){ return r.roomId === roomId; });
        if(room) room.notice = notice;
        note.textContent = '保存しました';
        note.style.color = '#7FC8AA';
      })
      .catch(function(){
        note.textContent = '通信エラーが発生しました';
        note.style.color = '#c9556a';
      });
  }

  function formatDate(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function formatYenLocal(v){
    if(!v && v !== 0) return '未設定';
    var n = Number(v);
    if(isNaN(n)) return '未設定';
    return n.toLocaleString() + '円';
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ページを開いたときに、以前入力した合言葉が残っていれば自動で使う
  (function(){
    var stored = sessionStorage.getItem(STAFF_TOKEN_STORAGE_KEY);
    if(stored){
      document.getElementById('tokenInput').value = stored;
    }
  })();

  // 合言葉入力欄でEnterキーを押したらログインする（PCでの利用を想定）
  document.getElementById('tokenInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      checkToken();
    }
  });
</script>
