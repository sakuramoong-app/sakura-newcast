<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご入店にあたってのご説明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F5;
    --paper:#fff;
    --ink:#5C4B4F;
    --sub:#9C8B8F;
    --pink:#F2A6B3;
    --pink-soft:#FDEDF0;
    --lav:#B9A6D9;
    --lav-soft:#F1EAFA;
    --mint:#7FC8AA;
    --mint-soft:#E6F6EE;
  }
  * { box-sizing: border-box; }
  html, body{
    margin:0;
    font-family: 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif;
    color:var(--ink);
    font-size:15px;
    line-height:1.75;
    background:var(--bg);
  }
  body{
    padding:22px 18px 40px;
    max-width:640px;
    margin:0 auto;
  }
  .header{ text-align:center; margin-bottom:18px; }
  .kicker{
    display:inline-block;
    font-size:13px;
    color:#fff;
    background:var(--pink);
    padding:5px 18px;
    border-radius:99px;
    font-weight:800;
  }
  h1{
    font-size:23px;
    margin:10px 0 6px;
    font-weight:800;
  }
  .to{ font-size:14px; color:var(--sub); margin-top:4px; }
  .to strong{ font-size:17px; color:var(--ink); }
  .lead{ font-size:12.5px; color:var(--sub); margin-top:8px; }

  .section{
    margin-bottom:18px;
    background:var(--paper);
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 3px 12px rgba(217,160,180,.14);
  }
  .section.alt{ background:var(--lav-soft); }
  .section.alt2{ background:var(--mint-soft); }
  .section.alt3{ background:var(--pink-soft); }
  .section-title{ font-size:16px; font-weight:800; margin-bottom:10px; }

  table.back-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
  }
  table.back-table th{
    background:var(--pink);
    color:#fff;
    font-size:12.5px;
    padding:8px 12px;
    text-align:left;
  }
  table.back-table td{
    padding:8px 12px;
    font-size:14px;
    border-bottom:1px solid #F5E3E6;
  }
  table.back-table td.amount{ text-align:right; font-weight:800; color:#c9556a; }

  .extra-list{ list-style:none; margin:0; padding:0; }
  .extra-list li{
    background:#fff;
    border-radius:10px;
    padding:8px 13px;
    margin-bottom:6px;
    font-size:13.5px;
    display:flex;
    justify-content:space-between;
  }

  .state-box{
    text-align:center;
    padding:60px 20px;
  }
  .state-box .emoji{ font-size:40px; margin-bottom:14px; }
  .state-box p{ color:var(--sub); font-size:14px; }

  .closing-note{
    text-align:center;
    font-size:11px;
    color:var(--sub);
    margin-top:24px;
    padding:10px;
  }

  /* 進捗バー */
  .progress-wrap{ margin-bottom:8px; }
  .progress-track{
    height:12px;
    background:#F5E3E6;
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--pink), #F0AA6E);
    border-radius:99px;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:11.5px;
    color:var(--sub);
    margin-top:6px;
    text-align:right;
  }

  /* チェックリスト */
  .check-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #F0E8E6;
  }
  .check-item:last-child{ border-bottom:none; }
  .check-icon{
    width:22px; height:22px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    margin-top:1px;
  }
  .check-icon.done{ background:var(--mint); color:#fff; }
  .check-icon.pending{ background:#eee; color:#bbb; }
  .check-icon.clickable{ cursor:pointer; transition:transform .1s ease; }
  .check-icon.clickable:active{ transform:scale(0.85); }
  .check-label{ font-size:13.5px; flex:1; }
  .check-label.done{ color:var(--sub); text-decoration:line-through; text-decoration-color:#ddd; }
  .check-toggle{
    font-size:11px;
    color:var(--pink);
    font-weight:700;
    background:var(--pink-soft);
    border:none;
    border-radius:99px;
    padding:5px 12px;
    cursor:pointer;
    flex-shrink:0;
  }
  .check-toggle:disabled{ opacity:0.4; cursor:default; }
  .check-staff-badge{
    font-size:10px;
    color:#9C8B8F;
    background:#eee;
    border-radius:99px;
    padding:2px 8px;
    flex-shrink:0;
  }

  /* 衣装アップロード */
  .costume-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  .costume-slot{
    aspect-ratio:3/4;
    border-radius:12px;
    background:#fff;
    border:2px dashed #F0C6CE;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
    overflow:hidden;
    position:relative;
  }
  .costume-slot img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .costume-fallback{
    width:100%; height:100%;
    align-items:center; justify-content:center;
    background:var(--mint-soft);
    flex-direction:column;
    gap:4px;
  }
  .costume-fallback .txt{ font-size:10.5px; color:#2c5b45; font-weight:700; }
  .costume-slot .plus{ font-size:24px; color:var(--pink); }
  .costume-slot .txt{ font-size:10.5px; color:var(--sub); }
  .costume-slot input[type=file]{ display:none; }
  .costume-slot .uploading{
    position:absolute; inset:0;
    background:rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--pink); font-weight:700;
  }

  /* ウィッグ/地毛選択 */
  .choice-row{ display:flex; gap:10px; margin-top:8px; }
  .choice-btn{
    flex:1;
    padding:11px;
    border-radius:12px;
    border:2px solid #eee;
    background:#fff;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    color:var(--sub);
    cursor:pointer;
  }
  .choice-btn.selected{ border-color:var(--pink); background:var(--pink-soft); color:var(--ink); }
  .sub-choice{ margin-top:10px; }
  .sub-choice-label{ font-size:12px; color:var(--sub); margin-bottom:6px; }
  .self-choice-note{
    font-size:11px;
    color:#c9556a;
    background:var(--pink-soft);
    display:inline-block;
    padding:3px 10px;
    border-radius:99px;
    margin-bottom:8px;
    font-weight:700;
  }

  .save-note{
    font-size:11px; color:var(--mint);
    margin-top:6px;
    height:14px;
  }

  .email-row{ display:flex; gap:8px; margin-top:8px; }
  .email-input{
    flex:1;
    padding:10px 13px;
    border:1.5px solid #eee;
    border-radius:11px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .email-input:focus{ outline:none; border-color:var(--pink); }
  .email-save-btn{
    border:none;
    background:var(--pink);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:11px;
    cursor:pointer;
    flex-shrink:0;
  }

  .profile-link-btn{
    display:block;
    text-align:center;
    background:var(--mint);
    color:#fff;
    font-weight:800;
    font-size:14px;
    padding:12px;
    border-radius:12px;
    text-decoration:none;
    margin-top:8px;
  }

  .tab-menu{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    background:#fff;
    padding:5px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(217,160,180,.14);
    position:sticky;
    top:8px;
    z-index:10;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color:var(--sub);
    font-family:inherit;
    font-weight:700;
    font-size:12.5px;
    padding:10px 4px;
    border-radius:10px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--pink);
    color:#fff;
  }

  .read-check-section{ text-align:center; }
  .read-check-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#fff;
    border-radius:14px;
    padding:16px;
    cursor:pointer;
  }
  .read-check-icon{
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    flex-shrink:0;
  }
  .read-check-icon.done{ background:var(--mint); color:#fff; }
  .read-check-icon.pending{ background:#eee; color:#bbb; }
  .read-check-label{ font-size:14px; font-weight:700; color:var(--ink); }

  .memo-textarea{
    width:100%;
    min-height:110px;
    padding:11px 13px;
    border:1.5px solid #eee;
    border-radius:12px;
    font-size:13.5px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    resize:vertical;
    margin-top:8px;
  }
  .memo-textarea:focus{ outline:none; border-color:var(--pink); }
  .memo-save-btn{
    display:block;
    width:100%;
    border:none;
    background:var(--pink);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:13.5px;
    padding:11px;
    border-radius:11px;
    cursor:pointer;
    margin-top:8px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="state-box">
    <div class="emoji">🌸</div>
    <p>読み込んでいます...</p>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxKWQsxsX2SJ0cZ7YfxZJgW1ujmM8xRvrNcjcDYpohI6Gqkem1BhiqVO0PcU8KjjMnf/exec';
  var roomId = null;
  var currentData = null;
  var currentTab = 'progress';

  function getParam(name){
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function renderError(message){
    document.getElementById('app').innerHTML =
      '<div class="state-box">' +
        '<div class="emoji">🌸</div>' +
        '<p>' + message + '</p>' +
      '</div>';
  }

  function formatYen(v){
    if(!v && v !== 0) return '未定';
    return Number(v).toLocaleString() + '円';
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function loadRoom(){
    fetch(GAS_URL + '?action=getRoom&id=' + encodeURIComponent(roomId))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error === 'not_found'){
          renderError('このページは見つかりませんでした。URLをご確認ください。');
        } else if(data.error === 'closed'){
          renderError('このページはすでに閉鎖されています。ご不明な点は店舗までご確認ください。');
        } else if(data.error){
          renderError('読み込みに失敗しました。時間をおいて再度お試しください。');
        } else {
          currentData = data;
          renderRoom(data);
        }
      })
      .catch(function(){
        renderError('読み込みに失敗しました。通信環境をご確認のうえ、再度お試しください。');
      });
  }

  function renderRoom(data){
    var html = '';
    html += '<div class="header">';
    html += '<span class="kicker">サクラムーングループ</span>';
    html += '<h1>ご入店にあたってのご説明</h1>';
    html += '<p class="to">キャスト名：<strong>' + escapeHtml(data.castName) + '</strong> 様</p>';
    html += '<p class="lead">面接時にご説明した内容をまとめました。わからないことがあれば、いつでも店舗までご質問ください。</p>';
    html += '</div>';

    // タブメニュー
    html += '<div class="tab-menu">';
    html += '<button class="tab-btn' + (currentTab === 'progress' ? ' active' : '') + '" onclick="switchTab(\'progress\')">バック・進捗</button>';
    html += '<button class="tab-btn' + (currentTab === 'guide' ? ' active' : '') + '" onclick="switchTab(\'guide\')">新人ガイド</button>';
    html += '<button class="tab-btn' + (currentTab === 'roadmap' ? ' active' : '') + '" onclick="switchTab(\'roadmap\')">姫デコロードマップ</button>';
    html += '</div>';

    html += '<div id="tabContent"></div>';

    document.getElementById('app').innerHTML = html;
    renderTabContent();
  }

  function switchTab(tab){
    currentTab = tab;
    renderRoom(currentData);
    window.scrollTo(0, 0);
  }

  function renderTabContent(){
    var html = '';
    if(currentTab === 'progress'){
      html = renderTabProgress(currentData);
    } else if(currentTab === 'guide'){
      html = renderTabGuide(currentData);
    } else if(currentTab === 'roadmap'){
      html = renderTabRoadmap(currentData);
    }
    html += '<div class="closing-note">※このページは在籍作成が完了次第、予告なく閉鎖します。</div>';
    document.getElementById('tabContent').innerHTML = html;
  }

  function renderTabProgress(data){
    var html = '';

    // 進捗バー
    var items = Object.keys(data.checklistMeta);
    var doneCount = items.filter(function(k){ return data.checklist[k] && data.checklist[k].done; }).length;
    var pct = Math.round(doneCount / items.length * 100);

    html += '<div class="section">';
    html += '<div class="section-title">準備の進み具合</div>';
    html += '<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div></div>';
    html += '<div class="progress-label">' + doneCount + ' / ' + items.length + ' 完了</div>';
    html += '</div>';

    // チェックリスト
    html += '<div class="section alt">';
    html += '<div class="section-title">やることリスト</div>';
    items.forEach(function(key){
      var meta = data.checklistMeta[key];
      var state = data.checklist[key] || { done: false };
      var isCast = meta.owner === 'cast';
      html += '<div class="check-item">';
      if(isCast){
        html += '<div class="check-icon ' + (state.done ? 'done' : 'pending') + ' clickable" onclick="toggleChecklist(\'' + key + '\',' + (!state.done) + ', this)">' + (state.done ? '✓' : '') + '</div>';
      } else {
        html += '<div class="check-icon ' + (state.done ? 'done' : 'pending') + '">' + (state.done ? '✓' : '') + '</div>';
      }
      html += '<div class="check-label ' + (state.done ? 'done' : '') + '">' + escapeHtml(meta.label) + '</div>';
      html += '</div>';
    });
    html += '</div>';

    // 衣装アップロード
    var urls = data.costumeUrls || ['', '', ''];
    html += '<div class="section alt3">';
    html += '<div class="section-title">衣装の写真</div>';
    html += '<p style="font-size:12.5px;color:var(--sub);">衣装の候補を3着まで送れます。タップして写真を選んでください。</p>';
    html += '<div class="costume-grid">';
    for(var i=0;i<3;i++){
      var url = urls[i] || '';
      html += '<label class="costume-slot" id="costumeSlot' + i + '">';
      if(url){
        html += '<img src="' + url + '" alt="衣装' + (i+1) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">';
        html += '<div class="costume-fallback" style="display:none;"><span class="txt">アップロード済み</span></div>';
      } else {
        html += '<span class="plus">＋</span><span class="txt">' + (i+1) + '着目</span>';
      }
      html += '<input type="file" accept="image/*" onchange="handleCostumeUpload(' + i + ', this)">';
      html += '</label>';
    }
    html += '</div>';
    html += '</div>';

    // 新人バナー
    var banner = data.bannerChoice || {};
    html += '<div class="section alt">';
    html += '<div class="section-title">新人バナーについて</div>';
    html += '<div class="self-choice-note">この項目はキャストさんご自身で選択お願いいたします</div>';
    html += '<p style="font-size:12.5px;color:var(--sub);">作成すると、お客様に見つけてもらいやすくなります。作成する場合、在籍開始まで約2週間、作成しない場合は約1週間弱かかります。</p>';
    html += '<div class="choice-row">';
    html += '<button class="choice-btn ' + (banner.wantBanner === true ? 'selected' : '') + '" onclick="setBanner(true)">作成する</button>';
    html += '<button class="choice-btn ' + (banner.wantBanner === false ? 'selected' : '') + '" onclick="setBanner(false)">作成しない</button>';
    html += '</div>';
    html += '</div>';

    // お仕事セット
    var kit = data.kitChoice || {};
    html += '<div class="section alt">';
    html += '<div class="section-title">お仕事セットについて</div>';
    html += '<div class="self-choice-note">この項目はキャストさんご自身で選択お願いいたします</div>';
    html += '<p style="font-size:12.5px;color:var(--sub);">ローション・うがい薬ボトル・ポーチは、事務所のものを使うか、ご自身で用意するか選べます。事務所のものを使う場合は買取500円（中身の補充は無料）です。</p>';
    html += '<div class="choice-row">';
    html += '<button class="choice-btn ' + (kit.type === 'shop' ? 'selected' : '') + '" onclick="setKit(\'shop\')">事務所で買う（500円）</button>';
    html += '<button class="choice-btn ' + (kit.type === 'own' ? 'selected' : '') + '" onclick="setKit(\'own\')">自分で用意する</button>';
    html += '</div>';
    html += '</div>';

    // ウィッグ/地毛
    var wig = data.wigChoice || {};
    html += '<div class="section alt2">';
    html += '<div class="section-title">ウィッグ・ヘアスタイルについて</div>';
    html += '<div class="self-choice-note">この項目はキャストさんご自身で選択お願いいたします</div>';
    html += '<div class="choice-row">';
    html += '<button class="choice-btn ' + (wig.type === 'wig' ? 'selected' : '') + '" onclick="setWig(\'wig\')">ウィッグを使う</button>';
    html += '<button class="choice-btn ' + (wig.type === 'jimoto' ? 'selected' : '') + '" onclick="setWig(\'jimoto\')">地毛で出勤する</button>';
    html += '</div>';
    if(wig.type === 'jimoto'){
      html += '<div class="sub-choice">';
      html += '<div class="sub-choice-label">ヘアメイクに行きますか？</div>';
      html += '<div class="choice-row">';
      html += '<button class="choice-btn ' + (wig.hairMake === true ? 'selected' : '') + '" onclick="setHairMake(true)">行く</button>';
      html += '<button class="choice-btn ' + (wig.hairMake === false ? 'selected' : '') + '" onclick="setHairMake(false)">行かない</button>';
      html += '</div>';
      html += '</div>';
    }
    html += '<div class="save-note" id="wigSaveNote"></div>';
    html += '</div>';

    // バック
    html += '<div class="section alt3">';
    html += '<div class="section-title">バックについて</div>';
    html += '<table class="back-table">';
    html += '<tr><th>コース</th><th style="text-align:right;">バック金額</th></tr>';
    html += '<tr><td>60分コース</td><td class="amount">' + formatYen(data.back60) + '</td></tr>';
    html += '<tr><td>90分コース</td><td class="amount">' + formatYen(data.back90) + '</td></tr>';
    html += '<tr><td>120分コース</td><td class="amount">' + formatYen(data.back120) + '</td></tr>';
    html += '</table>';
    html += '<ul class="extra-list">';
    html += '<li><span>オプションバック</span><span>基本半額</span></li>';
    html += '<li><span>射精オプション</span><span>5,000円中3,000円</span></li>';
    html += '<li><span>本指名バック（60分）</span><span>' + formatYen(data.backHonshimei60) + '</span></li>';
    html += '<li><span>本指名バック（90分以上）</span><span>' + formatYen(data.backHonshimei90) + '</span></li>';
    html += '</ul>';
    html += '</div>';

    // メールアドレス
    html += '<div class="section alt">';
    html += '<div class="section-title">メールアドレス</div>';
    html += '<p style="font-size:12.5px;color:var(--sub);">写メ日記ツールのご登録に使用します。</p>';
    html += '<div class="email-row">';
    html += '<input type="email" class="email-input" id="emailInput" placeholder="example@mail.com" value="' + escapeHtml(data.email || '') + '">';
    html += '<button class="email-save-btn" onclick="saveEmail()">保存</button>';
    html += '</div>';
    html += '<div class="save-note" id="emailSaveNote"></div>';
    html += '</div>';

    // 在籍プロフィール入力フォーム
    html += '<div class="section alt2">';
    html += '<div class="section-title">在籍プロフィール入力フォーム</div>';
    html += '<p style="font-size:12.5px;color:var(--sub);">下記のリンクから、在籍プロフィールのご入力をお願いします。</p>';
    html += '<a class="profile-link-btn" href="https://sakuramoong-app.github.io/cast-sakura-profile/" target="_blank">プロフィール入力フォームを開く</a>';
    html += '</div>';

    return html;
  }

  function renderTabGuide(data){
    var guideRead = !!data.guideRead;
    var html = `
<div class="section">
  <div class="section-title">初出勤までの流れ</div>

<div class="section">
  <div class="section-title">★お仕事の流れ★</div>
  <p><strong>入室前の準備</strong><br>ホテルのお部屋に入る前に、身だしなみを確認しましょう。</p>
  <ul class="prep-list">
    <li>髪の毛やメイクが崩れていないか、手鏡でチェック</li>
    <li>上着、帽子、マスクは入室前に外す</li>
    <li>上着は裏側を表にして腕に掛ける</li>
    <li>LINEのトーク画面やタイマーなど、必要なものをすぐ使えるよう準備しておく</li>
  </ul>

  <div class="flow-step"><span class="step-num">1</span><div class="fs-body">
    <div class="fs-title">入室・ご挨拶</div>
    <div>ドアをノックし、お客様に開けていただいてから入室します。靴をきれいに揃え、お客様の目を見て笑顔でご挨拶しましょう！ ※お客様の靴も揃えてあげると親切です◎</div>
  </div></div>

  <div class="flow-step"><span class="step-num">2</span><div class="fs-body">
    <div class="fs-title">自己紹介・コース確認・料金受け取り</div>
    <div>自己紹介をして、ご予約いただいているコース・料金を確認します。料金を受け取り、必要な場合はお釣りをお渡ししてください。自分のお財布とお客様からいただいた料金は必ず分けて管理し、貴重品は必ず目の届く場所に。お客様にも「安心して遊んでいただくため」とお伝えし、貴重品を目の届く場所で管理していただくようお願いしてください。</div>
    <div style="margin-top:6px;"><strong>有料オプションの事前説明：</strong>射精・コスプレ・ごっくんなど、プレイ中に追加されがちな有料オプションは、このタイミングで「有料になります」と事前に伝えておくとスムーズです。お客様が希望される場合は、先にお金をいただきたいので、すぐに内勤へ連絡してください（NGオプションの場合は説明を省略して構いません）。事前に伝えておくと、プレイ中にお金の話をする気まずさがなくなります。</div>
  </div></div>

  <div class="flow-step"><span class="step-num">3</span><div class="fs-body">
    <div class="fs-title">お店へインコール</div>
    <div>料金を受け取ったら、「料金いただきました」とお店へインコールをしてください。LINEトークでの連絡でOKです。</div>
  </div></div>

  <div class="flow-step"><span class="step-num">4</span><div class="fs-body">
    <div class="fs-title">タイマーをセット</div>
    <div>コース終了の少し前に鳴るようセットします。例：90分コースなら終了15分前の「75分」でセット。※入室前にタイマー画面を準備しておくとスムーズです◎</div>
  </div></div>

  <div class="flow-step"><span class="step-num">5</span><div class="fs-body">
    <div class="fs-title">シャワーへご案内</div>
    <div>シャワー中にうがいもしていただきます。必要なプレイの場合は、シャワー前に浣腸をしてあげてください。脱いだ服は、手が空いたタイミングで畳んであげると◎</div>
    <div style="margin-top:6px;"><strong>逆AFをする場合：</strong>浣腸はトイレで済ませ、うがい薬でうがいをしてからシャワーへ誘導します。服はたたみ、シャワーで身体を洗います。</div>
    <div style="margin-top:6px;"><strong>湯船を使う場合：</strong>お湯をためるなら、料金をいただいた後のタイミングがおすすめです。お湯をためている間も、貴重品は肌身離さず持ち歩いてください。</div>
  </div></div>

  <div class="flow-step"><span class="step-num">6</span><div class="fs-body">
    <div class="fs-title">ベッドでプレイスタート</div>
    <div>プレイ中にお客様から有料オプションを希望された場合は、有料オプションであることを必ずお伝えし、了承をいただいたうえでお店へLINEで確認してください。お店から確認が取れてからオプションを行い、プレイ終了後に追加料金をいただいてください。</div>
  </div></div>

  <div class="flow-step"><span class="step-num">7</span><div class="fs-body">
    <div class="fs-title">終了時間が近づいたら</div>
    <div>タイマーが鳴ったら終了時間が近づいている合図です。お客様へお声がけしてシャワーへご案内してください。予定より早く終わった場合はマッサージやお話で残り時間を過ごしましょう。※お客様が早めに帰りたい場合はそのまま終了でOKです。</div>
  </div></div>

  <div>
    <p style="margin-top:8px;"><strong>【退室後の注意】</strong></p>
    <div class="warn-box">
      お客様と一緒にホテルを退室し、駅などまで一緒になる場合は、その後に後をつけられないよう十分注意してください。特に待機場へ戻る場合は、待機場の場所を知られないように。少し遠回りをする／コンビニに立ち寄る／お客様と別れてから時間を空ける、など周囲を確認してから戻りましょう。自分の安全を最優先に行動してください。
    </div>
  </div>
</div>

<div class="section">

  <p><strong>準備と移動</strong><br>
  出勤したらいつお仕事が入ってもいいように準備を完了し、移動もできるだけ速やかに行ってください。</p>
  <p><strong>勤怠について</strong><br>

<div class="section alt">

  <p><strong>プレイ時間の遵守</strong><br>
  コースの許容範囲は±5分です。時間をきっちりコントロールし、延長になりそうな場合は「これ以上は延長になります」とはっきり伝えましょう。お客様をお待たせするとホテル代の延長やお客様の予定を狂わせ、お店の信頼低下に直結します。オプションやコース変更がある場合は速やかにお店に連絡してください。</p>
  <p><strong>接客するにあたっての注意点</strong><br>
  プレイ中の飲酒は一切禁止です。お客様との連絡先交換は可能ですが、裏引き行為等が発覚した際は罰金の対象となります。飲酒の強要や連絡先交換の強要がしつこい場合は、「お店に確認します」とお伝えのうえ、接客中でもお店に電話してください。</p>
</div>

<div class="section alt2">

  <ul>

<div class="section">
  <div class="section-title">お仕事をするにあたり④：心構え</div>
  <p>なんとなく仕事をしている場合は慣れてくると楽に思うかもしれませんが、お客様がどうやったら喜んで、そしてまた来てくれるかを考え実践している人は楽ではありません。それはどんな仕事でもそうです。創意工夫を常に行う人と慣れだけで仕事をしている人とではクオリティやあらゆる面で差がどんどん広がっていきます。</p>
  <p>どうすればもっと良くなるだろうという向上心と、おもてなしの心（ホスピタリティ）を持ってお仕事することを継続できれば、当店でのお給料が増えるだけではなく今後他の仕事（全く別の職種であっても）に就いた際必ず役に立ちます。どうせなら当店に在籍している間に是非チャレンジしてみてください。</p>
</div>

<div class="section alt2">

  function toggleChecklist(key, done, iconEl){
    // 楽観的更新：まず見た目を即座に変える
    var prevState = currentData.checklist[key] ? currentData.checklist[key].done : false;
    currentData.checklist[key] = { done: done, at: done ? new Date().toISOString() : '' };

    if(iconEl){
      iconEl.className = 'check-icon clickable ' + (done ? 'done' : 'pending');
      iconEl.textContent = done ? '✓' : '';
      iconEl.setAttribute('onclick', "toggleChecklist('" + key + "'," + (!done) + ", this)");
      var labelEl = iconEl.nextElementSibling;
      if(labelEl){
        labelEl.className = 'check-label' + (done ? ' done' : '');
      }
    }

    // 進捗バーも即座に更新
    updateProgressBarOnly();

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateChecklist', id: roomId, key: key, done: done, isStaff: false })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          // 失敗時は元に戻す
          currentData.checklist[key] = { done: prevState, at: '' };
          renderRoom(currentData);
          alert('更新に失敗しました');
          return;
        }
        currentData.checklist = result.checklist;
      })
      .catch(function(){
        currentData.checklist[key] = { done: prevState, at: '' };
        renderRoom(currentData);
        alert('通信エラーが発生しました');
      });
  }

  function updateProgressBarOnly(){
    var items = Object.keys(currentData.checklistMeta);
    var doneCount = items.filter(function(k){ return currentData.checklist[k] && currentData.checklist[k].done; }).length;
    var pct = Math.round(doneCount / items.length * 100);
    var fillEl = document.querySelector('.progress-fill');
    var labelEl = document.querySelector('.progress-label');
    if(fillEl) fillEl.style.width = pct + '%';
    if(labelEl) labelEl.textContent = doneCount + ' / ' + items.length + ' 完了';
  }

  function handleCostumeUpload(slot, input){
    var file = input.files[0];
    if(!file) return;

    var slotEl = document.getElementById('costumeSlot' + slot);
    var loadingDiv = document.createElement('div');
    loadingDiv.className = 'uploading';
    loadingDiv.textContent = 'アップロード中...';
    slotEl.appendChild(loadingDiv);

    var reader = new FileReader();
    reader.onload = function(e){
      var base64 = e.target.result.split(',')[1];
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadCostume',
          id: roomId,
          slot: slot,
          imageBase64: base64,
          mimeType: file.type
        })
      })
        .then(function(res){ return res.json(); })
        .then(function(result){
          if(result.error){
            alert('アップロードに失敗しました：' + result.error);
            loadRoom();
            return;
          }
          currentData.costumeUrls = result.costumeUrls;
          currentData.checklist = result.checklist;
          renderRoom(currentData);
        })
        .catch(function(){
          alert('通信エラーが発生しました');
          loadRoom();
        });
    };
    reader.readAsDataURL(file);
  }
