<style>
  :root{
    color-scheme: light;
    --bg:#FAF7F5;
    --paper:#fff;
    --ink:#5C4B4F;
    --sub:#9C8B8F;
    --pink:#F2A6B3;
    --pink-soft:#FDEDF0;
    --lav:#B9A6D9;
    --lav-soft:#F1EAFA;
    --mint:#7FC8AA;
    --mint-soft:#E6F6EE;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#FAF7F5 !important;
      --paper:#fff !important;
      --ink:#5C4B4F !important;
      --sub:#9C8B8F !important;
      --pink:#F2A6B3 !important;
      --pink-soft:#FDEDF0 !important;
      --lav:#B9A6D9 !important;
      --lav-soft:#F1EAFA !important;
      --mint:#7FC8AA !important;
      --mint-soft:#E6F6EE !important;
    }
    html, body{
      background:#FAF7F5 !important;
      color:#5C4B4F !important;
    }
  }
  * { box-sizing: border-box; }
  html, body{
    margin:0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", Roboto, sans-serif;
    color:#5C4B4F !important;
    font-size:15px;
    line-height:1.75;
    background:#FAF7F5 !important;
  }
  body{
    padding:22px 18px 40px;
    max-width:640px;
    margin:0 auto;
  }
  .header{ text-align:center; margin-bottom:18px; }
  .confidential-badge{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    color:#fff;
    background:#D9333F;
    padding:4px 14px;
    border-radius:99px;
    margin-bottom:10px;
    letter-spacing:0.05em;
  }
  .kicker{
    display:inline-block;
    font-size:13px;
    color:#fff;
    background:var(--pink);
    padding:5px 18px;
    border-radius:99px;
    font-weight:800;
  }
  h1{
    font-size:23px;
    margin:10px 0 6px;
    font-weight:800;
    color:#5C4B4F;
  }
  .to{ font-size:14px; color:var(--sub); margin-top:4px; }
  .to strong{ font-size:17px; color:var(--ink); }
  .lead{ font-size:12.5px; color:var(--sub); margin-top:8px; }

  .section{
    margin-bottom:18px;
    background:var(--paper);
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 3px 12px rgba(217,160,180,.14);
  }
  .section.alt{ background:var(--lav-soft); }
  .section.alt2{ background:var(--mint-soft); }
  .section.alt3{ background:var(--pink-soft); }
  .section-title{ font-size:16px; font-weight:800; margin-bottom:10px; color:#5C4B4F; }

  table.back-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
  }
  table.back-table th{
    background:var(--pink);
    color:#fff;
    font-size:12.5px;
    padding:8px 12px;
    text-align:left;
  }
  table.back-table td{
    padding:8px 12px;
    font-size:14px;
    border-bottom:1px solid #F5E3E6;
  }
  table.back-table td.amount{ text-align:right; font-weight:800; color:#c9556a; }

  .extra-list{ list-style:none; margin:0; padding:0; }
  .extra-list li{
    background:#fff;
    border-radius:10px;
    padding:8px 13px;
    margin-bottom:6px;
    font-size:13.5px;
    display:flex;
    justify-content:space-between;
  }

  .state-box{
    text-align:center;
    padding:60px 20px;
  }
  .state-box .emoji{ font-size:40px; margin-bottom:14px; }
  .state-box p{ color:var(--sub); font-size:14px; }

  .closing-note{
    text-align:center;
    font-size:11px;
    color:var(--sub);
    margin-top:10px;
    padding:10px;
  }

  /* 進捗バー */
  .progress-wrap{ margin-bottom:8px; }
  .progress-track{
    height:12px;
    background:#F5E3E6;
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;

<div id="glossaryModal" class="glossary-modal">

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxKWQsxsX2SJ0cZ7YfxZJgW1ujmM8xRvrNcjcDYpohI6Gqkem1BhiqVO0PcU8KjjMnf/exec';
  var roomId = null;
  var currentData = null;
  var currentTab = 'progress';
  var COSTUME_MAX_SLOTS_LOCAL = 8;

  function showLoading(){

    if(el) el.classList.add('show');
  }
  function hideLoading(){
    var el = document.getElementById('loadingOverlay');
    if(el) el.classList.remove('show');

  var GLOSSARY = {
    himedeco: {
      title: '🌸 ヘブンの姫デコとは？',
      body: '「ヘブン」という風俗情報サイトで、日記の投稿・マイガールの管理・アクセス確認・メッセージなどができる、キャストさん専用の管理ツールです。<br><br>出勤中の集客やお客様とのやり取りに欠かせない、大切なツールです。<br><br>💡 基本的にログインはサクラムーンでお願いします。サクラムーンから日記を投稿することで、全10媒体への同時投稿が可能になります。'
    },
    diary: {
      title: '📸 写メ日記とは？また、その重要性とは？',
      body: '写真と文章を投稿して、お客様に自分のことを知ってもらうための大切なツールです。<br>人柄や雰囲気を知ってもらうことで、興味や安心感につながり、予約のきっかけになります✨<br><br>ヘブンの姫デコから投稿し、全部で10媒体に同じ写メ日記を同時投稿することができます。'
    },
    mygirl: {
      title: '💗 マイガールとは？',
      body: 'お客様が「気になる！」と思ったキャストさんをお気に入り登録できる機能です。<br><br>登録してくれる方が増えるほど、日記や出勤情報を見てもらえる機会も増えていきます。'
    },
    mygirlDiary: {
      title: '🔐 マイガール限定日記とは？',
      body: 'マイガール登録をしてくれているお客様だけが見ることのできる限定の日記です。<br>少し特別な内容を投稿することで、マイガール登録をしてくれている方との距離を縮めるきっかけになります。<br><br>※この投稿はサクラムーンのヘブンにのみ投稿され、他媒体には同時投稿されません。それでも集客につながる大切な機能なので、ぜひ積極的に取り組んでほしいです✨'
    },
    videoDiary: {
      title: '🎥 動画日記とは？',
      body: '動画を使って、写真だけでは伝わりにくい雰囲気や魅力を伝えられる日記です。<br>声や話し方、仕草なども伝わるので、お客様により自分らしさを知ってもらえます。<br><br>※この投稿はサクラムーンのヘブンにのみ投稿され、他媒体には同時投稿されません。こちらも大切な集客ツールのひとつなので、ぜひ積極的に取り組んでほしいです✨'
    },
    mitene: {
      title: '👀 ミテネとは？',
      body: 'お客様に「私のページも見てね！」とアピールできる機能です。<br><br>自分からアクションすることで、プロフィールや日記を見てもらうきっかけを増やせます。'
    },
    okinitalk: {
      title: '💬 オキニトークとは？',
      body: 'お客様とメッセージでやり取りができる機能です。<br><br>気軽な会話を重ねながら自分のことを知ってもらい、予約につながるきっかけを作ることができます。'
    }
  };

  function showGlossary(key){
    var item = GLOSSARY[key];
    if(!item) return;
    document.getElementById('glossaryTitle').textContent = item.title;
    document.getElementById('glossaryBody').innerHTML = item.body;
    document.getElementById('glossaryModal').classList.add('show');
  }

  function closeGlossary(){
    document.getElementById('glossaryModal').classList.remove('show');
  }


  function getParam(name){
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function renderError(message){
    document.getElementById('app').innerHTML =
      '<div class="state-box">' +
        '<div class="emoji">🌸</div>' +
        '<p>' + message + '</p>' +
      '</div>';
  }

  function formatYen(v){
    if(!v && v !== 0) return '未定';
    return Number(v).toLocaleString() + '円';
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function loadRoom(){
    fetch(GAS_URL + '?action=getRoom&id=' + encodeURIComponent(roomId))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error === 'not_found'){
          renderError('このページは見つかりませんでした。URLをご確認ください。');
        } else if(data.error === 'closed'){
          renderError('このページはすでに閉鎖されています。ご不明な点は店舗までご確認ください。');
        } else if(data.error){
          renderError('読み込みに失敗しました。時間をおいて再度お試しください。');
        } else {
          currentData = data;
          renderRoom(data);
        }
      })
      .catch(function(){
        renderError('読み込みに失敗しました。通信環境をご確認のうえ、再度お試しください。');
      });
  }

  function renderRoom(data){
    var html = '';
    html += '<div class="header">';
    html += '<div class="confidential-badge">🔒 社外秘</div>';
    html += '<span class="kicker">サクラムーングループ</span>';
    html += '<h1>ご入店にあたってのご説明</h1>';
    html += '<p class="to">キャスト名：<strong>' + escapeHtml(data.castName) + '</strong> 様</p>';
    html += '<p class="lead">面接時にご説明した内容をまとめました。わからないことがあれば、いつでも店舗までご質問ください。</p>';
    html += '<div class="closing-note">※このページは在籍作成が完了次第、予告なく閉鎖します。</div>';
    html += '</div>';

    // タブメニュー
    html += '<div class="tab-menu">';
    html += '<button class="tab-btn' + (currentTab === 'progress' ? ' active' : '') + '" onclick="switchTab(\'progress\')">バック・進捗</button>';

  function toggleChecklist(key, done, iconEl){
    // 楽観的更新：まず見た目を即座に変える
    var prevState = currentData.checklist[key] ? currentData.checklist[key].done : false;
    currentData.checklist[key] = { done: done, at: done ? new Date().toISOString() : '' };

    if(iconEl){
      iconEl.className = 'check-icon clickable ' + (done ? 'done' : 'pending');
      iconEl.textContent = done ? '✓' : '';
      iconEl.setAttribute('onclick', "toggleChecklist('" + key + "'," + (!done) + ", this)");
      var labelEl = iconEl.nextElementSibling;
      if(labelEl){
        labelEl.className = 'check-label' + (done ? ' done' : '');
      }
    }

    // 進捗バーも即座に更新
    updateProgressBarOnly();

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateChecklist', id: roomId, key: key, done: done, isStaff: false })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          // 失敗時は元に戻す
          currentData.checklist[key] = { done: prevState, at: '' };
          renderRoom(currentData);
          alert('更新に失敗しました');
          return;
        }
        currentData.checklist = result.checklist;
      })
      .catch(function(){
        currentData.checklist[key] = { done: prevState, at: '' };
        renderRoom(currentData);
        alert('通信エラーが発生しました');
      });
  }

  function updateProgressBarOnly(){
    var items = Object.keys(currentData.checklistMeta);
    var doneCount = items.filter(function(k){ return currentData.checklist[k] && currentData.checklist[k].done; }).length;
    var pct = Math.round(doneCount / items.length * 100);
    var fillEl = document.querySelector('.progress-fill');
    var labelEl = document.querySelector('.progress-label');
    if(fillEl) fillEl.style.width = pct + '%';
    if(labelEl) labelEl.textContent = doneCount + ' / ' + items.length + ' 完了';
  }

  function handleCostumeUpload(slot, input){
    var file = input.files[0];
    if(!file) return;

    var slotEl = document.getElementById('costumeSlot' + slot) || document.getElementById('costumeSlotAdd');
    if(slotEl){
      var loadingDiv = document.createElement('div');
      loadingDiv.className = 'uploading';
      loadingDiv.textContent = 'アップロード中...';
      slotEl.appendChild(loadingDiv);
    }

    var reader = new FileReader();
    reader.onload = function(e){
      var base64 = e.target.result.split(',')[1];
      showLoading();
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadCostume',
          id: roomId,
          slot: slot,
          imageBase64: base64,
          mimeType: file.type
        })
      })
        .then(function(res){ return res.json(); })
        .then(function(result){
          hideLoading();
          if(result.error){
            alert('アップロードに失敗しました：' + result.error);
            loadRoom();
            return;
          }
          currentData.costumeUrls = result.costumeUrls;
          currentData.checklist = result.checklist;
          renderRoom(currentData);
        })
        .catch(function(){
          hideLoading();
          alert('通信エラーが発生しました');
          loadRoom();
        });
    };
    reader.readAsDataURL(file);
  }

        }
        currentData.roadmapRead = true;
        currentData.checklist = result.checklist;
        renderTabContent();
      })
      .catch(function(){
        note.textContent = '通信エラーが発生しました';
        note.style.color = '#c9556a';
      });
  }

  function saveMemo(){
    var textarea = document.getElementById('memoTextarea');
    var note = document.getElementById('memoSaveNote');
    var memo = textarea.value;

    note.textContent = '保存中...';
    note.style.color = '#9C8B8F';

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'setMemo', id: roomId, memo: memo })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          note.textContent = '保存に失敗しました';
          note.style.color = '#c9556a';
          return;
        }
        currentData.memo = memo;
        note.textContent = '保存しました';
        note.style.color = '#7FC8AA';
      })
      .catch(function(){
        note.textContent = '通信エラーが発生しました';
        note.style.color = '#c9556a';
      });
  }

  function setKit(type){
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'setKitChoice', id: roomId, type: type })
    })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if(result.error){
          alert('保存に失敗しました');
          return;
        }
        currentData.kitChoice = result.kitChoice;
        currentData.checklist = result.checklist;
        renderRoom(currentData);
      })
      .catch(function(){ alert('通信エラーが発生しました'); });
  }

  (function(){
    roomId = getParam('id');
    if(!roomId){
      renderError('URLが正しくありません。お手数ですが、送られたリンクをそのままお使いください。');
      return;
    }
    loadRoom();
  })();
</script>

</body>
</html>
